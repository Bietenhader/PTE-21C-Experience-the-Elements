# Release (SPEC §18, M5). Started by hand on main: Actions → Release → Run workflow, with the version.
# It checks that package.json carries that version, that CHANGELOG.md has a section for it and that the
# tag does not exist yet, then creates the tag v<version> on this commit and the GitHub Release, whose
# notes are that CHANGELOG section. Nothing is built or uploaded: the site itself is on GitHub Pages.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in package.json (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the version and take its notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version must look like 0.1.0"; exit 1; }
          [[ "$(node -p 'require("./package.json").version')" == "$VERSION" ]] \
            || { echo "::error::package.json is not at version $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::the tag v$VERSION already exists"; exit 1
          fi
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [[ -n "$(tr -d '[:space:]' < notes.md)" ]] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "PTE-21C v$VERSION" --notes-file notes.md
