# --- Solar system ------------------------------------------------------------------------------
#
# Solar-system elemental abundances, copied as printed from
#   K. Lodders, M. Bergemann & H. Palme (2025), 'Solar System Elemental Abundances from the Solar
#   Photosphere and CI-Chondrites', Space Sci. Rev. 221, 23, doi:10.1007/s11214-025-01146-w (CC BY 4.0).
# Table 6 = main text (pp. 47-50); Table A13 = Electronic Supplementary Material (11214_2025_1146_MOESM1_ESM.pdf).
# quantity: mass_fraction (dimensionless) | atoms_per_1e6_Si (N(Si) = 1e6) | log_eps (A(E) = log10(N_E/N_H) + 12, dex)
# epoch: present = present-day solar system (photosphere/CI); protosolar = 4.567 Ga ago (settling + decay corrected)
# Not tabulated (omitted): Tc, Pm (no values), Po-Ac, Pa, Z > 92. Sm mass fraction omitted (corrupted row; see README).
#
# The build uses the proto-solar mass fraction as abundance.solar and the present-day log ε as
# abundance.solarLogEps; the other columns are kept for the panels and for checking.

[[solar]]
Z = 1
quantity = "mass_fraction"
epoch = "protosolar"
value = 0.7061
source = "lodders2025"
table = "Table A13 (Electronic Supplementary Material)"
note = "Proto-solar (4.567 Ga ago) elemental mass fraction, column 'Elemental Mass Fractions' of ESM Table A13; the table gives no uncertainty (relative sigma of N(E) in Table 6 applies)."

