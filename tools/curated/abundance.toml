#
# Abundances (SPEC §6.2, §10.4). The crust and sea-water estimates are not here: they are read
# from the PubChem element pages (Jefferson Lab estimates) by the build.
#
# body: mass of the element in the ICRP "Reference Man" (adult male, 70 kg), as printed in
# ICRP Publication 23 (1975), Table 110, pp. 327-328 (read from the page scan hosted by
# BioNumbers, BNID 110328); the major elements agree with Kerr (1982), ORNL/TM-8318, Table 1,
# which reprints them. Values printed as "<" are upper limits and are entered as limits, not as
# values. Rubidium is left out: its printed row repeats the strontium row and other sources
# give a different figure. These are 1970s estimates for one reference body, not a precise or
# universal composition; the app says so.
#
# Columns: Z, quantity ("body" | "solar"), value, unit, limit ("upper"), source, doi, note.


