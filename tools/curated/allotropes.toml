  { Z = 15, symbol = "P", name = "Red phosphorus", note = "Made by heating white phosphorus: a polymeric, far less reactive form, used on matchbox striking strips.", source = "greenwood_earnshaw" },
  { Z = 15, symbol = "P", name = "Black phosphorus", note = "The most stable form: puckered layers, flaky and graphite-like, made under high pressure.", source = "greenwood_earnshaw" },
  { Z = 15, symbol = "P", name = "Violet (Hittorf's) phosphorus", note = "A crystalline polymeric form of long tubes of phosphorus atoms.", source = "greenwood_earnshaw" },

