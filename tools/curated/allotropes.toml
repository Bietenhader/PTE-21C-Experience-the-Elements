#
# The well-known allotropes (different forms of the pure element) shown on the physical panel (SPEC §10.4).
# Names and one-line descriptions in our own words, after Greenwood & Earnshaw, Chemistry of the Elements,
# 2nd edition (1997); graphene, isolated after that edition, cites its first report. standard = true marks the
# form that is the element's reference state at 25 °C and 1 bar. Elements with no row show no allotrope list;
# many metals also change crystal structure on heating or under pressure, and only a few are listed here.

row = [
  { Z = 5, symbol = "B", name = "β-rhombohedral boron", standard = true, note = "The stable form: a complicated framework of linked B₁₂ icosahedra, more than 100 atoms per cell.", source = "greenwood_earnshaw" },
  { Z = 5, symbol = "B", name = "α-rhombohedral boron", note = "The simplest form: B₁₂ icosahedra packed in layers, 12 atoms per cell; red, transparent crystals.", source = "greenwood_earnshaw" },
  { Z = 5, symbol = "B", name = "Amorphous boron", note = "A brown powder without long-range order.", source = "greenwood_earnshaw" },

  { Z = 6, symbol = "C", name = "Graphite", standard = true, note = "Flat sheets of carbon hexagons stacked loosely: soft, black and electrically conducting along the sheets.", source = "greenwood_earnshaw" },
