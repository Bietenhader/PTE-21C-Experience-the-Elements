# --- isotopes in biology and medicine ----------------------------------------------------------

[[isotope_use]]
Z = 1
A = 3
field = "tracer"
text = "Broad-bean root tips fed tritium-labelled thymidine, a DNA building block, were followed through two cell divisions in 1957: each chromosome kept one labelled and one new half, a first view of how chromosomes are copied."
source = "primary_literature"
doi = "10.1073/pnas.43.1.122"

[[isotope_use]]
Z = 1
A = 2
field = "tracer"
text = "Water labelled with deuterium and oxygen-18 measures the energy a free-living animal or person spends: hydrogen leaves the body only in water, oxygen in water and in exhaled CO2, so the difference between their loss rates gives the CO2 produced."
source = "primary_literature"
doi = "10.1016/0022-5193(66)90185-8"

[[isotope_use]]
Z = 6
A = 14
field = "dating"
text = "Carbon-14, made by cosmic rays in the air, enters every living thing and decays once it dies; in 1949 Arnold and Libby showed that the fraction left dates organic remains, checking it on wood and objects of known age."
source = "primary_literature"
doi = "10.1126/science.110.2869.678"

[[isotope_use]]
Z = 6
A = 14
field = "tracer"
text = "Giving algae carbon dioxide labelled with carbon-14 for seconds at a time let Bassham, Benson and Calvin trace the path of carbon in photosynthesis, the cycle now named after them."
source = "primary_literature"
doi = "10.1016/S0021-9258(18)56368-7"

[[isotope_use]]
Z = 6
A = 13
field = "environment"
text = "Land plants fall into two groups by their ratio of carbon-13 to carbon-12; the groups match the two main photosynthetic pathways, C3 and C4, so the ratio tells them apart."
source = "primary_literature"
doi = "10.1104/pp.47.3.380"

[[isotope_use]]
Z = 7
A = 15
field = "tracer"
text = "Bacteria grown on heavy nitrogen-15 and then moved to ordinary nitrogen-14 made DNA of intermediate density, separable in a centrifuge: Meselson and Stahl's 1958 proof that DNA is copied semi-conservatively."
source = "primary_literature"
doi = "10.1073/pnas.44.7.671"

[[isotope_use]]
Z = 7
A = 15
field = "environment"
text = "The share of nitrogen-15 differs between nitrogen sources and changes as nitrogen passes through soils, plants and food webs, so it traces where the nitrogen in an ecosystem comes from and where it goes."
source = "primary_literature"
doi = "10.1016/S0169-5347(00)02098-X"

[[isotope_use]]
Z = 8
A = 18
field = "tracer"
text = "Water labelled with oxygen-18 showed in 1941 that the oxygen released in photosynthesis comes from water, not from carbon dioxide."
source = "primary_literature"
doi = "10.1021/ja01848a512"

[[isotope_use]]
Z = 8
A = 18
field = "environment"
text = "The oxygen-18 share in the shells of fossil foraminifera records the temperature and ice volume of past oceans; Emiliani's 1955 study of deep-sea cores mapped the glacial cycles of the Pleistocene."
source = "primary_literature"
doi = "10.1086/626295"

[[isotope_use]]
Z = 9
A = 18
field = "medicine"
text = "Fluorine-18 in a glucose analogue (FDG), first made in 1978 to measure how much sugar the brain uses: cells take it up like glucose but cannot use it further, so it collects where they are most active, which a PET scanner then sees."
source = "primary_literature"
doi = "10.1002/jlcr.2580140204"

[[isotope_use]]
Z = 15
A = 32
field = "tracer"
text = "Phosphorus-32 fed to rats in 1935, one of the first radioactive tracers in physiology, showed that the phosphorus in bone is constantly exchanged rather than laid down for good."
source = "primary_literature"
doi = "10.1038/136754a0"

[[isotope_use]]
Z = 15
A = 32
field = "tracer"
text = "With phage DNA labelled by phosphorus-32 and phage protein by sulfur-35, Hershey and Chase showed in 1952 that mainly the DNA enters the infected bacterium: evidence that genes are made of DNA."
source = "primary_literature"
doi = "10.1085/jgp.36.1.39"

[[isotope_use]]
Z = 16
A = 35
field = "tracer"
text = "Sulfur-35 marked the protein coat in Hershey and Chase's 1952 phage experiment; it stayed outside the infected bacteria while the DNA, labelled with phosphorus-32, went in."
source = "primary_literature"
doi = "10.1085/jgp.36.1.39"

[[isotope_use]]
Z = 38
A = 87
field = "environment"
text = "The ratio of strontium-87 to strontium-86 varies with the local rocks and passes almost unchanged from soil and water to plants, bones and teeth, so it can show where a person or animal grew up."
source = "primary_literature"
doi = "10.1007/s10816-006-9009-x"

[[isotope_use]]
Z = 43
A = 99
isomer = "m"
field = "medicine"
text = "Technetium-99m, milked on site from a generator of its parent molybdenum-99, is the workhorse of nuclear-medicine imaging: its six-hour half-life and single gamma line suit scans of bone, heart, kidneys and much else."
source = "primary_literature"
doi = "10.1016/j.jcmg.2008.12.013"

[[isotope_use]]
Z = 53
A = 131
field = "medicine"
text = "The thyroid gathers iodine from the blood, so radioactive iodine-131 can treat an overactive thyroid from the inside; it was first used for this in the 1940s."
source = "primary_literature"
doi = "10.1001/jama.1946.02870190005002"

[[isotope_use]]
Z = 53
A = 131
field = "environment"
text = "After the Chernobyl accident iodine-131 (half-life eight days) reached children through milk and collected in their thyroids; by 2005 more than 6000 thyroid cancers had been diagnosed among those exposed as children or adolescents in Belarus, Russia and Ukraine, a large fraction of them attributed to it."
source = "unscear_chernobyl"

[[isotope_use]]
Z = 55
A = 137
field = "environment"
text = "Caesium-137 from fallout behaves much like potassium: plant roots take it up through their potassium transporters, and clay minerals hold it in the soil, which is why potassium fertiliser and clay-rich soils keep it out of crops."
source = "primary_literature"
doi = "10.1093/jexbot/51.351.1635"

[[isotope_use]]
Z = 64
field = "medicine"
text = "Gadolinium ions, locked in tight chemical cages (chelates) because the free ion is toxic, are the standard contrast agents for MRI: their seven unpaired electrons make the water protons around them relax faster, which brightens the image."
source = "primary_literature"
doi = "10.1021/cr980440x"

[[isotope_use]]
Z = 71
A = 177
field = "medicine"
text = "Lutetium-177 bound to a molecule that docks onto prostate-cancer cells (PSMA-617) prolonged survival in advanced prostate cancer in a 2021 trial; its beta radiation is delivered from inside, at the tumour."
source = "primary_literature"
doi = "10.1056/NEJMoa2107322"

[[isotope_use]]
Z = 88
A = 223
field = "medicine"
text = "Radium-223, an alpha emitter that the body treats like calcium, settles where bone is rebuilt around tumours; a 2013 trial showed that it prolongs life in prostate cancer that has spread to bone."
source = "primary_literature"
doi = "10.1056/NEJMoa1213755"

