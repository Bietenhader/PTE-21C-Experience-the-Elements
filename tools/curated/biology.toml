doi = "10.1088/0952-4746/27/1/001"

[[toxicity]]
Z = 86
text = "Radon's radioactive decay products lodge in the lungs; WHO estimates that radon causes 3 to 14 % of all lung cancers in a country, depending on its radon levels and on how many people smoke."
