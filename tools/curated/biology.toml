text = "Technetium-99m, milked on site from a generator of its parent molybdenum-99, is the workhorse of nuclear-medicine imaging: its six-hour half-life and single gamma line suit scans of bone, heart, kidneys and much else."
source = "primary_literature"
doi = "10.1016/j.jcmg.2008.12.013"

[[isotope_use]]
