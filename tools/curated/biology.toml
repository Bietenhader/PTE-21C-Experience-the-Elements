[[environment]]
Z = 15
text = "Phosphorus is the nutrient that most often limits algae in lakes, so phosphate in runoff and sewage is a main driver of their eutrophication."
source = "primary_literature"
doi = "10.1016/S0269-7491(99)00091-3"

[[environment]]
Z = 33
text = "Arsenic dissolved naturally from rocks into groundwater is the greatest threat from it: wells in Bangladesh and many other countries exceed safe levels, and crops irrigated with such water carry it into food."
source = "who_arsenic"

[[environment]]
Z = 34
text = "Selenium leached from soils by irrigation drainage collected in the Kesterson ponds in California in the early 1980s and caused deformed and dead embryos in water birds."
source = "primary_literature"
doi = "10.1016/0048-9697(86)90104-X"

[[environment]]
Z = 38
text = "Strontium follows calcium from soil and water into plants, bones and teeth; strontium-90 from fallout takes the same path."
source = "primary_literature"
doi = "10.1007/s10816-006-9009-x"

[[environment]]
Z = 48
text = "Cadmium from phosphate fertilisers, sewage sludge, mining and industry builds up in soils; crops take it up, and food, rice and other staples above all, is most people's main source of it."
source = "primary_literature"
doi = "10.1016/j.tplants.2012.08.003"

[[environment]]
Z = 80
text = "Bacteria turn mercury released into water into methylmercury, which builds up in fish and shellfish, most in large predatory fish."
source = "who_mercury"

[[environment]]
Z = 86
text = "Radon seeps out of the ground, where uranium in rocks and soil decays, and collects indoors; outdoors it is quickly diluted."
source = "who_radon"

# --- toxicity ------------------------------------------------------------------------------------

[[toxicity]]
Z = 33
