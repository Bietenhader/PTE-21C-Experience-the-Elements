[[isotope_use]]
Z = 15
A = 32
field = "tracer"
text = "With phage DNA labelled by phosphorus-32 and phage protein by sulfur-35, Hershey and Chase showed in 1952 that mainly the DNA enters the infected bacterium: evidence that genes are made of DNA."
