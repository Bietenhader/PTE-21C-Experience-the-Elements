doi = "10.1016/j.taap.2009.03.015"

[[toxicity]]
Z = 80
text = "Mercury harms the nervous system above all, and the unborn and young children most; at Minamata, Japan, methylmercury in factory waste poisoned people who ate the local fish (Minamata disease)."
source = "primary_literature"
doi = "10.3109/10408449509089885"

[[toxicity]]
Z = 82
text = "Lead harms the brain, kidneys and blood and is most dangerous to young children and to the unborn; no level of exposure is known to be without harm."
source = "who_lead"

[[toxicity]]
Z = 84
text = "Polonium-210's alpha particles cannot pass through skin, but swallowed or inhaled it is extraordinarily toxic: a tiny amount killed Alexander Litvinenko in London in 2006."
