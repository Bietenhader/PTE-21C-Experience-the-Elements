# --- toxicity ------------------------------------------------------------------------------------

[[toxicity]]
Z = 33
text = "Years of drinking water or eating food with inorganic arsenic lead to chronic poisoning, seen first in the skin as lesions and cancers."
source = "who_arsenic"

[[toxicity]]
Z = 48
text = "Cadmium accumulates in the kidneys over decades; in Japan's Jinzū river basin it caused itai-itai disease, with kidney damage and brittle, painful bones."
source = "primary_literature"
doi = "10.1016/j.taap.2009.03.015"

[[toxicity]]
Z = 80
text = "Mercury harms the nervous system above all, and the unborn and young children most; at Minamata, Japan, methylmercury in factory waste poisoned people who ate the local fish (Minamata disease)."
source = "primary_literature"
doi = "10.3109/10408449509089885"

[[toxicity]]
Z = 82
text = "Lead harms the brain, kidneys and blood and is most dangerous to young children and to the unborn; no level of exposure is known to be without harm."
source = "who_lead"

[[toxicity]]
Z = 84
text = "Polonium-210's alpha particles cannot pass through skin, but swallowed or inhaled it is extraordinarily toxic: a tiny amount killed Alexander Litvinenko in London in 2006."
source = "primary_literature"
doi = "10.1088/0952-4746/27/1/001"

[[toxicity]]
Z = 86
text = "Radon's radioactive decay products lodge in the lungs; WHO estimates that radon causes 3 to 14 % of all lung cancers in a country, depending on its radon levels and on how many people smoke."
source = "who_radon"

