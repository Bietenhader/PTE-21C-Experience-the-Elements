# Chemistry & bonding (SPEC §10.9): one row per element, in our own words, every statement with a source.
#
# bonding            how the atoms of the element itself hold together: metallic | covalent network |
#                    covalent layers | covalent chains | molecular | monatomic (with bonding_source)
# air, water, acids  qualitative reactivity notes, each with *_source. They restate what the HSDB (`hsdb`)
#                    or CAMEO Chemicals (`cameo_chemicals`) records of the elemental substance say, in our
#                    own words; textbook facts cite `greenwood1997`. Where a note is absent the row gives
#                    reactivity_missing (a SPEC §5.3 reason) and reactivity_note.
# compounds          well-known compounds; `pubchem_compounds` rows are looked up by name (or by `lookup`,
#                    when PubChem files the compound under another name) and the build checks PubChem's
#                    formula against ours.
#                    Where there are none the row gives compounds_missing (a SPEC §5.3 reason) and
#                    compounds_note.
# oxidation_examples one compound per common oxidation state (the bold states of the tile); an ion
#                    (NpO2⁺) where that state lives mainly in solution. oxidation_note adds what the
#                    examples leave out.
# note_source       where a row has nothing but Missing notes, the source those notes rest on.
# No sentence is copied from any source.

