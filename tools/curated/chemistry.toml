Z = 1  # H
bonding = "molecular"
bonding_note = "H₂ molecules, held together in the liquid and solid only by weak van der Waals forces."
bonding_source = "greenwood1997"
air = "Highly flammable: it burns in air to water, and mixtures of hydrogen and air can explode."
air_source = "cameo_chemicals"
water = "Does not react with water and barely dissolves in it."
