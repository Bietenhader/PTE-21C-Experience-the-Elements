# SPDX-License-Identifier: CC-BY-NC-SA-4.0
#
# Crystal structures of the elements in their standard state (SPEC §6.2, §10.4), one entry of the
# Crystallography Open Database (COD, CC0) per element; every number is read from the CIF named by
# cod_id (Å × 100 → pm), and DOIs were checked against Crossref. Gases and liquids are given as
# low-temperature solids and flagged not_solid_at_rtp. A temperature is given only where the CIF
# states one (temperature_missing otherwise); nothing is guessed.
#
# Pearson symbols: crystal family + centring (A/B/C-centred → S, the IUCr convention; older texts
# write C) + atoms per conventional cell, counted by applying the CIF symmetry operators to the CIF
# sites; for R lattices per primitive rhombohedral cell (hexagonal cell / 3).
#
# Review notes: rows flagged doubtful (Ar, Rb, Tc, Hg, Eu) say why in their note; phosphorus is
# black phosphorus (COD has no room-temperature white phosphorus); caesium is at 78 K.

