discovered = 1817
discoverers = ["Johan August Arfwedson"]
place = "Stockholm, Sweden"
name_origin = "From the Greek lithos, 'stone', since it was first found in a mineral (petalite)."
source = "pubchem"
note = "Arfwedson worked in Berzelius's Stockholm laboratory. CIAAW gives 1818. Sources differ on the first isolation of the metal: Jefferson Lab credits electrolysis by Brande and Davy, while CIAAW names Bunsen and Matthiessen (1855), who made it in quantity."

[[row]]
Z = 4
