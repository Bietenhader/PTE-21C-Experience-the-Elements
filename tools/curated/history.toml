#
# Discovery history and naming, one row per element (SPEC §6.2, §10.11). All prose is our own wording.
# Facts were checked against the cached PubChem element pages (History section: Los Alamos National
# Laboratory, Jefferson Lab and IUPAC CIAAW texts; YearDiscovered from the PubChem periodic table) and,
# for Z >= 101, against the IUPAC/IUPAP Transfermium Working Group (1993) and Joint Working Party reports
# (DOIs confirmed on Crossref). Where those sources disagree, the row says so in `note`.
#
# Columns: Z; discovered (year, or "antiquity"); discovered_text (qualifier, optional);
#          discoverers (people, or for Z >= 101 the laboratories credited by IUPAC/IUPAP);
#          place (city of the discovery, modern country; omitted when unknown or uncertain, and for
#          antiquity; map coordinates will come from a public-domain gazetteer, not from this file); isolated, isolated_by (only when the pure element was first
#          obtained in a different year; isolated_by omitted when the source names nobody);
#          name_origin; symbol_note (only when the symbol is not from the English name, or changed);
#          source (pubchem | iupac_discovery | primary_literature); doi; note.

[[row]]
Z = 1
discovered = 1766
discoverers = ["Henry Cavendish"]
place = "London, United Kingdom"
name_origin = "Coined by Lavoisier from the Greek hydor, 'water', and -genes, 'producing', because burning it yields water."
source = "pubchem"
note = "Boyle had made the gas around 1671 without recognizing it as new; Cavendish showed it was a distinct substance. Los Alamos prints 1776, apparently a slip for 1766."

[[row]]
Z = 2
discovered = 1868
discoverers = ["Pierre Janssen", "Norman Lockyer"]
place = "Guntur, India"
isolated = 1895
isolated_by = ["William Ramsay"]
name_origin = "From the Greek helios, 'Sun', because it was first seen as an unexplained yellow line in the solar spectrum."
source = "pubchem"
note = "Janssen recorded the line during the solar eclipse of August 1868 (the map dot is his observing site) and Lockyer argued it came from an unknown element. Ramsay found the gas on Earth in the uranium mineral cleveite in 1895; Cleve and Langlet found it there independently."

[[row]]
