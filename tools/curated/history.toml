discoverers = ["Louis-Nicolas Vauquelin"]
place = "Paris, France"
isolated = 1828
isolated_by = ["Friedrich Wöhler", "Antoine Bussy"]
name_origin = "From beryl (Greek beryllos), the gemstone that contains it."
symbol_note = "Long called glucinium (symbol Gl), after the sweet taste of its salts; IUPAC chose the name beryllium in 1949."
source = "pubchem"
note = "CIAAW dates Vauquelin's discovery to 1797. Wöhler and Bussy obtained the metal independently, both by reducing the chloride with potassium."

[[row]]
