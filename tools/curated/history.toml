place = "Paris, France"
name_origin = "From borax, its best-known compound (a word traced to the Arabic buraq and Persian burah), given the ending of carbon."
source = "pubchem"
note = "Gay-Lussac and Thénard in Paris and Davy in London obtained it independently in 1808, all by heating boric acid with potassium."

[[row]]
Z = 6
