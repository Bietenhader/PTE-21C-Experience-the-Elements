#
# Ground-state hyperfine splittings per isotope (SPEC §6.2). One row per isotope and charge state;
# every row carries a source key from tools/sources.toml (and the DOI of the primary measurement
# where there is one). Every number was read in the document named in the row's evidence line
# (the arXiv version where the journal is paywalled); every DOI was checked against Crossref.
# Uncertain rows are omitted, never guessed. Rubidium-87 is not typed here: its splitting is the
# BIPM recommended value, taken from the fetched list by the build (bipm_frequencies).
#
# Columns: Z, A, charge (0 = neutral atom, 1 = singly charged ion), I, J,
#          A_MHz (magnetic dipole constant) and A_unc_MHz, B_MHz and B_unc_MHz (electric quadrupole,
#          only for J ≥ 1), splitting_Hz and unc_Hz (standard uncertainty; 0 = exact by definition),
#          splitting_text (exact decimal where a double loses digits), source, doi, note.
# For J = 1/2 the splitting is |A|(I + 1/2), the interval between the two F levels. For J ≥ 1 it
# is the width of the ground-level hyperfine manifold, E(F_max) − E(F_min), computed from A and B
# (SPEC §11.4); the build recomputes every splitting from A (and B) as a consistency check.

