# SPDX-License-Identifier: CC-BY-NC-SA-4.0
#
# Which photographs each element shows (SPEC §12). Chosen by eye from the candidates that
# tools/fetch_images.py lists in tools/images-report.md; this file wins over any heuristic.
#
#   pin          files in display order: images-of-elements.com files as the element page names
#                them ("iron.jpg", or "s/rhodium.jpg" where the site has only its 400 px copy),
#                or Wikimedia Commons titles ("File:…").
#   kind         per-file kind (SPEC §5 ImageRef): sample, discharge_tube, crystal, powder,
#                liquid, historical. Default: sample.
#   title        per-file caption, in our own words.
#   credit       per-file author and licence where the element page credits someone other than
#                the site ("unless otherwise noted"); images-of-elements files without a credit
#                entry are the site's own (Jürgen Kummer, CC BY 3.0).
#   placeholder  "never_visible" (never made in a visible amount) or "no_free_photo" (made in
#                visible amounts, but no openly licensed photograph was found); the card is drawn
#                by the app (SPEC §12.5) and comes first.
#   exclude      files looked at and rejected, with the reason in a comment.
#
# Rejected throughout: photos of minerals, ores, alloys, compounds, coins and objects (they are
# not the element); the site's illustrations ("This is only an illustration, not … itself");
# any photo marked © / "all rights reserved" (Theodore Gray, LANL 2011, JRC-ITU, CERN, SOHO).

