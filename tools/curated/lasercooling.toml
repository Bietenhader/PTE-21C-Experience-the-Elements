#          The catalog cites Campbell et al., Phys. Rev. Lett. 102, 233004 (2009) (not DOI-checked here).
# No other catalog species was skipped: all 26 atom-catalog elements and 10 of the 11 ion-catalog
# elements have rows (several elements have extra isotope rows for BEC / Fermi-gas milestones).
# LEFT OUT (no row field written, by design):
#  - first_cooled_year for neutral atoms other than H: the catalog gives one "laser cooled and trapped"
#    reference per element, which is entered as first_mot; no separately sourced first-cooling paper.
#  - Rb first_mot: the catalog's Rb paper (Walker, Hoffmann, Feng, Williamson, Phys. Lett. A 163, 309 (1992),
#    doi 10.1016/0375-9601(92)91017-l, "A vortex-force atom trap") is not a MOT paper, so no first-MOT year.
#  - Hg+ first_cooled: catalog entry is blank.
#  - repump_nm for alkalis (same D2 line, other hyperfine level), for Sr, Ba, Cr (several repumps),
#    and for Yb+ (935 nm line not in NIST ASD).
#  - Other BEC isotopes (e.g. 86Sr, 170/176Yb, 162/160Dy, 166/170Er) were not added; only the element's first
#    BEC and first degenerate Fermi gas, plus the main cooling isotope where it differs.
