#
# Laser-cooled species and their cooling transitions (SPEC §6.2, §10.6). One row per species
# (element, isotope or "natural", charge 0 = neutral atom, 1 = singly charged ion).
#
# Species list and the first "laser cooled and trapped" reference of each: S. Olmschenk's atom and
# ion catalogs (olmschenk_catalog, read 2026-10-21). That reference is entered as first_mot (for
# almost every element it was a magneto-optical trap; the note says where not), or as first_cooled
# for hydrogen and the ions. BEC and degenerate-Fermi-gas firsts were checked against arXiv reviews
# (Chomaz et al. 2201.02672; Stellmer et al. 1307.0601; Vassen et al. 1110.1361; Ketterle &
# Zwierlein 0801.2500). Every year has a DOI, and every DOI was checked against Crossref; years are
# publication years.
#
# wavelength_nm / repump_nm: vacuum wavelengths exactly as NIST ASD prints them (observed where NIST
# has one, else Ritz; the note says which). The linewidth Γ is NOT typed here: the build takes the
# Einstein coefficient A_ki of the same line from the fetched NIST data (tools/fetch_nist_lines.py
# fetches a vacuum window around every wavelength below), and the app computes Doppler and recoil
# temperatures from Γ, λ and the mass (SPEC §11.3).
#
# Columns: Z, A, charge, state ("ground" | "metastable"), lower, upper, wavelength_nm,
#          wavelength_source, repump_nm, first_cooled_year/_doi, first_mot_year/_doi,
#          bec_year/_doi, dfg_year/_doi, source, note.

