# SPDX-License-Identifier: CC-BY-NC-SA-4.0
# Fractions of each element made by six processes at the time the Solar System formed, from
#   C. Kobayashi, A. I. Karakas & M. Lugaro (2020), 'The Origin of Elements from Carbon to Uranium',
#   ApJ 900, 179, doi:10.3847/1538-4357/abae65 (arXiv:2008.04660), Fig. 39 and Sect. 3.5 text.
# No table or data file exists; values were READ OFF THE FIGURE (lossless 2336x1169 raster from the arXiv
# PDF / source) by pixel classification, see README. flag = 'estimated' for every figure value;
# flag = 'paper_statement' where the paper gives a qualitative statement instead (H, Be, B).
# Process keys: bigbang (black), cosmic_rays (not in the model), agb (green), massive_stars (blue: SNe II,
# hypernovae, electron-capture SNe, magneto-rotational SNe), neutron_star_mergers (magenta),
# white_dwarfs (red: SNe Ia). Zero-valued keys omitted. Fractions are of the MODEL abundance at t = 9.2 Gyr.
# Method, per-element raw readings and checks: docs/approach.md (M2, cosmic origin).
# Omitted: He, Li, Tc, Pm, Pb (see README) and all elements not in the figure (Po-Ac, Pa, Z > 92).

[[row]]
Z = 1
bigbang = 1.00
flag = "paper_statement"
source = "kobayashi2020"
note = "Paper Sect. 3.5: 'H and most of He are produced in Big Bang nucleosynthesis. The small green and blue areas also includes the amounts returned to the ISM via stellar mass loss'. Stars only destroy or return H, so the figure's green/blue (raw reading at the 9.2-Gyr line: AGB 0.14, massive 0.05; box saturated) are recycled Big-Bang H, not production. Value set from the statement, not read off the figure."

[[row]]
Z = 4
cosmic_rays = 1.00
flag = "paper_statement"
source = "kobayashi2020"
note = "Paper Sect. 3.5: 'Be and B are supposed to be produced by cosmic rays [Prantzos et al. 1993], which is not included in our model either.' Empty box in Fig. 39. Value is the paper's qualitative statement, not a modelled fraction."

