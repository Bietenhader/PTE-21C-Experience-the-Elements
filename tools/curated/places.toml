#
# Where each discovery place is on the map (SPEC §10.11): one row per `place` used in history.toml,
# spelled exactly as there. No coordinate is typed here: each row names the gazetteer entry, and the
# build reads the latitude and longitude from the cached gazetteer file.
#
#   gazetteer = "natural_earth"  Natural Earth 1:10m populated places (public domain); `name` and
#                                `country` are Natural Earth's own spelling (name, adm0name).
#   gazetteer = "geonames"       GeoNames cities5000 (CC BY 4.0), for towns too small for Natural
#                                Earth; `geonames_id` picks the entry (Dubna has a namesake).
#
# The map dot marks the town; where history.toml says the place was an observing site or a
# laboratory, its note says so.

[[place]]
place = "London, United Kingdom"
gazetteer = "natural_earth"
name = "London"
country = "United Kingdom"
