# --- Aluminium (Z = 13) ---
[[plant]]
Z = 13
uptake = "Dissolved aluminium from acid soil water; in most plants it stays bound in the outer cell walls of the roots"
uptake_source = "barker_pilbeam2015"
uptake_doi = "10.1201/b18458-20"
known_text = "1955, when Chenery reported that the tea bush needs it for normal growth"
known_source = "mengel_kirkby2001"
known_doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 13
topic = "deficiency"
text = "Some plants of acid soils grow better with aluminium: tea roots grew two and a half times faster with it in one experiment, and the oak Quercus serrata, Melastoma and hydrangea respond too; how it helps is not yet understood."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 13
topic = "deficiency"
text = "For most other plants, the gains reported in nutrient solutions are probably a side effect: the aluminium removes excess phosphate from the solution rather than meeting a real need."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-20"

[[plant_note]]
Z = 13
topic = "toxicity"
text = "In acid soils, dissolved aluminium is toxic to most plants: within an hour the roots stop lengthening, then turn short and stubby with cracked tips, and the shoots wilt and show signs of calcium, magnesium, phosphorus and nitrogen shortage."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-20"

[[plant_note]]
Z = 13
topic = "soil"
text = "Above pH 5.5 soil water usually holds less than 1 mg of aluminium per litre, but much more dissolves as a soil becomes more acid."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 13
topic = "soil"
text = "Liming with calcium and magnesium compounds neutralises the acidity; growing tolerant crops helps too, but works best together with liming, because the soil keeps acidifying."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-20"

[[plant_note]]
Z = 13
topic = "partners"
text = "In acid soils aluminium hinders the multiplication of the Rhizobium bacteria, so legumes form fewer root nodules."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 13
topic = "wild"
text = "Some plants, mostly tropical trees and shrubs, gather aluminium in their leaves: over 1000 mg per kg of dry leaf, against under 200 mg in most plants; old tea leaves can hold 3%, and buckwheat is a crop that does the same."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-20"

[[plant_note]]
Z = 13
topic = "wild"
text = "The blue colour of hydrangea flowers comes from aluminium stored in the petals."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 13
topic = "forest"
text = "Dissolved aluminium in acid forest soils can hold back root growth, but tolerance of acid soils varies widely, and many tree species cope well."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch6"

[[plant_note]]
Z = 13
topic = "forest"
text = "Much of the aluminium dissolved in forest soil water is bound to dissolved organic matter, and in that form it is not toxic."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch7"

[[plant_note]]
Z = 13
topic = "food"
text = "Tea is made from young leaves, which hold only about 600 mg of aluminium per kg, under 2% of the level in old leaves, so tea probably adds little to the aluminium people take in."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-20"

# --- Silicon (Z = 14) ---
[[plant]]
Z = 14
uptake = "Uncharged silicic acid, Si(OH)₄; rice and many other crops have transporter proteins for it"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00012-5"
job = 2
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "around 1960, when rice was found not to grow normally in nutrient solutions without it"
known_source = "epstein1972"

[[plant_note]]
Z = 14
topic = "deficiency"
text = "Rice short of silicon sets little grain: a rice mutant that cannot take it up lost over 90% of its yield in the field, which is why silicon fertilisers are spread on paddy fields in some countries."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 14
topic = "deficiency"
text = "Sugarcane needs at least 1% silicon by weight for a full cane yield; with only a quarter of that the yield halves, and leaves in full sun become freckled."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 14
topic = "soil"
text = "Plants take silicon from soil water as silicic acid released by weathering; deeply weathered soils such as Oxisols can run short of it, and liming lowers its uptake."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_19"

[[plant_note]]
Z = 14
topic = "wild"
text = "Grasses and sedges hold far more silicon than most flowering plants; much of it sits as tiny bodies of silica (phytoliths) in the skin of the leaf."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 14
topic = "wild"
text = "The field horsetail (Equisetum arvense) cannot do without silicon; its gritty, silica-rich ash was once used to scour pots and pans."
source = "epstein1972"

[[plant_note]]
Z = 14
topic = "food"
text = "Animals need a little silicon for their connective tissue, but grazing animals that eat much silica-rich grass can suffer wear of the rumen wall and deposits in the kidneys."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

# --- Phosphorus (Z = 15) ---
[[plant]]
Z = 15
uptake = "Phosphate ions, mostly H₂PO₄⁻, from the soil water"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00019-8"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 2000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 2
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 15
topic = "deficiency"
text = "Leaves grow fewer and smaller but stay dark green, as their expansion is held back more than their chlorophyll; the plant sends more of its sugar to the roots. Flowering comes late, with fewer flowers and seeds."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 15
topic = "deficiency"
text = "Short plants stand stiffly upright; the signs begin on the older leaves, and the stems of many annual plants turn reddish from anthocyanin pigments. Cereals form fewer side shoots."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_9"

[[plant_note]]
Z = 15
topic = "toxicity"
text = "Phosphorus poisoning is rare, because most plants throttle their phosphate uptake once they have enough. Many native plants of very poor soils in Australia and South Africa can hardly do this and are harmed when given phosphate fertiliser."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 15
topic = "soil"
text = "Over nine tenths of the phosphorus in a soil is locked away, in hardly soluble phosphates of calcium, iron and aluminium, in humus, or held on oxides and clays; only a tiny share is dissolved, and it reaches roots mainly by slow diffusion."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_9"

[[plant_note]]
Z = 15
topic = "soil"
text = "Most phosphate fertiliser is made from rock phosphate, a resource that cannot be renewed and is gradually being used up."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 15
topic = "partners"
text = "Arbuscular mycorrhizal fungi spread hyphae beyond the zone that roots have already emptied of phosphate and pass what they gather to the plant; in one experiment the hyphae supplied 70–80 % of all the phosphorus the plants took up."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00004-6"

[[plant_note]]
Z = 15
topic = "partners"
text = "Legumes with root nodules need more phosphorus than other plants, and a lack of it is often what limits their nitrogen fixation, above all on acid and on limy soils."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 15
topic = "wild"
text = "In ancient landscapes phosphorus, not nitrogen, is often the main limit on wild plant growth. Some plants grow dense 'cluster roots' that release a burst of organic acids and so 'mine' phosphate that mycorrhizal fungi cannot reach."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 15
topic = "forest"
text = "Phosphorus limits forests on old soils rich in iron and aluminium, common in the subtropics and tropics. Unlike nitrogen it has no gas form, so it cannot come from the air."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 15
topic = "forest"
text = "Most mid-rotation loblolly pine plantations in the south-eastern USA grow faster when given nitrogen and phosphorus together, and intensively grown eucalypt plantations need large additions of both."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 15
topic = "food"
text = "Seeds store most of their phosphorus as phytate. People cannot digest it, so the zinc and iron bound to it are poorly absorbed."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

