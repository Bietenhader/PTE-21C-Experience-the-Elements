# --- Manganese (Z = 25) ---
[[plant]]
Z = 25
uptake = "Only as the divalent ion Mn²⁺"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "low"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 50
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1922
known_by = "J. S. McHargue"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 25
topic = "deficiency"
text = "The youngest leaves yellow faintly between the veins, because manganese hardly moves out of older leaves; severe shortage adds brown spots. In the field cereals show it as patchy 'light spot disease', and peas as 'marsh spot' in their seeds."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 25
topic = "deficiency"
text = "Oats, barley, wheat, soybean and peach are susceptible, rye is not. Manganese-short plants are also more easily killed by frost and more open to root-rot fungi such as take-all."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 25
topic = "toxicity"
text = "Too much shows as small brown spots on mature leaves, and in soybean as crinkled leaves. Tolerance differs enormously: growth falls at about 200 mg per kg of shoot dry matter in maize but only at about 5,300 in sunflower."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 25
topic = "soil"
text = "How much manganese is available swings with soil pH, moisture and air: limy, sandy and peaty soils tend to hold too little, while acid or waterlogged soils release too much."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 25
topic = "partners"
text = "On acid tropical soils, manganese toxicity often holds back nitrogen fixation by legumes; liming helps, and mycorrhizal fungi ease the toxicity."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 25
topic = "partners"
text = "Plants with arbuscular mycorrhiza often take up less manganese than plants without the fungus, unlike zinc and copper, of which they take up more."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00004-6"

[[plant_note]]
Z = 25
topic = "wild"
text = "Plants that tolerate a lot of manganese, such as sunflower and stinging nettle, store the excess in the cell walls at the base of their leaf hairs, which turn dark."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 25
topic = "forest"
text = "Manganese rarely limits forests (perhaps on some limestone soils in New Zealand and South Africa), and manganese toxicity, which can harm farm crops, has not been reported in forests."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

