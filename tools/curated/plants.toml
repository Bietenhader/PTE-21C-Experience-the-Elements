# --- Sulfur (Z = 16) ---
[[plant]]
Z = 16
uptake = "Sulfate (SO₄²⁻) from the soil water; leaves can also take in sulfur dioxide (SO₂) from the air"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00019-8"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 1000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 1
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 16
topic = "deficiency"
text = "Leaves lose chlorophyll and protein and the plant grows slowly. Unlike nitrogen shortage, the yellowing in wheat is spread over old and young leaves alike; in legumes, sulfur shortage looks just like nitrogen shortage."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 16
topic = "deficiency"
text = "In oilseed rape the young leaves show it first, turning reddish with dying edges, and the yellow flowers can turn white; fully developed rape leaves with less than about 6 mg of sulfur per gram of dry matter point to a shortage."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_8"

[[plant_note]]
Z = 16
topic = "toxicity"
text = "Plants put up with a lot of sulfate in the soil; only very salty soils do harm. Sulfur dioxide in polluted air is more dangerous, and trees and other perennials are hurt at about half the level that harms annual plants."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_8"

[[plant_note]]
Z = 16
topic = "soil"
text = "Most of a soil's sulfur is bound in organic matter, usually 100–1000 mg per kg in humid regions; it becomes available as microbes break that matter down, and sulfate is easily washed out."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_8"

[[plant_note]]
Z = 16
topic = "soil"
text = "Sulfur dioxide from industry once supplied much of crops' sulfur. Since emissions were cut in recent decades, sulfur shortage has become common on farmland, above all in rainy regions and on leached soils, and sulfur fertilisers are now used to correct it."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 16
topic = "partners"
text = "Nitrogen fixation in legume nodules is very sensitive to sulfur shortage: early on, it suffers more than photosynthesis does."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 16
topic = "forest"
text = "Sulfur rarely limits forests; trees take sulfate from the soil and some sulfur dioxide from the air."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 16
topic = "food"
text = "Wheat short of sulfur makes flour whose dough stretches less and gives a smaller loaf, because its grain proteins hold less of the sulfur amino acids that link the gluten together."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

[[plant_note]]
Z = 16
topic = "food"
text = "The sharp taste of cabbage, mustard and their relatives comes from sulfur compounds (glucosinolates), which rise with the sulfur supply; more makes vegetables spicier but fodder less welcome to animals."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

