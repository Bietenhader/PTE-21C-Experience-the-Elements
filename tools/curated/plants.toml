# --- Cobalt (Z = 27) ---
[[plant]]
Z = 27
uptake = "Co²⁺ ions; most of it stays in the roots"
uptake_source = "barker_pilbeam2015"
uptake_doi = "10.1201/b18458-21"
known_text = "1960, when Ahmed and Evans reported that legumes living on nitrogen fixed in their root nodules need it"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 27
topic = "deficiency"
text = "On low-cobalt soils, legumes that rely on their nodules for nitrogen form fewer, weaker nodules, start fixing nitrogen weeks late and yellow as if short of nitrogen; legumes fed with nitrate grow well without it."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 27
topic = "deficiency"
text = "Treating the seed with cobalt corrects the shortage, best together with leaf sprays; field responses are rare, but have been seen on poor sandy soils."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 27
topic = "toxicity"
text = "Too much cobalt makes leaves fall early, stops them greening, discolours the veins and holds back shoot growth; the step from too little to too much is fairly small."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-21"

[[plant_note]]
Z = 27
topic = "soil"
text = "Soils formed from serpentine and other magnesium-rich rocks are rich in cobalt, those from granite, sandstone or limestone poor; much of it is held on manganese oxides, where plants cannot reach it."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_19"

[[plant_note]]
Z = 27
topic = "partners"
text = "Rhizobium and other nitrogen-fixing bacteria cannot live without cobalt: they build it into vitamin B12, which they need, among other things, to make the leghaemoglobin of the nodules; the root nodules of alder need it too."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 27
topic = "wild"
text = "Most leaves hold less than 0.2 mg of cobalt per kg of dry matter, but a few plants of metal-rich soils store up to 5000 mg per kg."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 27
topic = "food"
text = "Grazing ruminants need cobalt so that their rumen microbes can make vitamin B12; on low-cobalt soils, forage with less than about 0.07 mg per kg leaves them short, a widespread problem."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

# --- Nickel (Z = 28) ---
[[plant]]
Z = 28
uptake = "Ni²⁺, or nickel bound in small complexes"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
typical_mg_kg = 0.1
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 4
job_source = "marschner2023"
job_doi = "10.1016/b978-0-12-819773-8.00016-2"
known_year = 1987
known_by = "P. H. Brown and colleagues"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 28
topic = "deficiency"
text = "Cereals short of nickel yellow between the veins and get dead patches on their youngest leaves, much like iron shortage, and urea builds up to harmful levels in leaf tips because the enzyme that breaks it down, urease, contains nickel."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 28
topic = "deficiency"
text = "The first cases in the field were pecan trees on sandy, poorly drained soils in the south-eastern USA, whose leaves grew deformed ('mouse-ear'). Barley seed from nickel-short plants germinates poorly."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 28
topic = "toxicity"
text = "Crops are more often harmed by too much nickel than too little, from industrial pollution, sewage sludge or heavy manuring. Sensitive species suffer above about 10 mg per kg of dry matter, moderately tolerant ones above about 50."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 28
topic = "soil"
text = "How much nickel roots can take up depends on soil pH, organic matter, waterlogging and temperature; zinc and copper compete with it at the root."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 28
topic = "partners"
text = "Nickel is part of hydrogenase in nodule bacteria and of urease in legumes. In field trials, nickel added to the soil raised soybean nodulation, nitrogen fixation and grain yield, most likely on sandy, low-nickel or limed soils."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 28
topic = "wild"
text = "Serpentine soils, rich in iron, magnesium, nickel, chromium and cobalt but poor in calcium, carry 'hyperaccumulators' such as some Alyssum species, whose leaves hold 10–30 g of nickel per kg of dry matter. They are used to clean polluted soil and even to harvest nickel."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 28
topic = "forest"
text = "Trees need nickel, but never in amounts that limit forest growth."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

# --- Copper (Z = 29) ---
[[plant]]
Z = 29
uptake = "Cu²⁺; when copper is scarce, roots first reduce it to Cu⁺"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "intermediate"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 6
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 4
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1931
known_by = "C. B. Lipman and G. MacKinney"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 29
topic = "deficiency"
text = "Young leaves are distorted and bleached, and stems bend or twist because their walls lack lignin, so cereals fall over (lodge) easily. Grain and fruit suffer most, because copper-short plants make sterile pollen."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 29
topic = "deficiency"
text = "Cereals turn bushy, with white twisted leaf tips and partly empty ears. Oats, spinach, wheat and lucerne respond most to copper fertiliser; beans, grass, potatoes and soybeans least."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_16"

[[plant_note]]
Z = 29
topic = "toxicity"
text = "Copper builds up in soils from years of copper fungicides (in vineyards and coffee plantations), sewage sludge and pig or poultry slurry. Roots stop growing first, because they trap most of the excess."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 29
topic = "soil"
text = "Shortage occurs on soils naturally poor in copper, such as leached sandy soils, and on soils that bind it, such as peats, limy and some clay soils; it is common enough on newly drained peat to be called 'reclamation disease'."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_16"

[[plant_note]]
Z = 29
topic = "soil"
text = "Copper sulfate or oxide spread on the soil can keep working for decades, up to 30 years in southern Australia; leaf sprays act faster but can scorch leaves if too strong."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 29
topic = "partners"
text = "Plants with arbuscular mycorrhiza usually take up more copper and zinc than plants without the fungus."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00004-6"

[[plant_note]]
Z = 29
topic = "partners"
text = "Too much copper in the soil harms nitrogen fixation in legume nodules."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 29
topic = "wild"
text = "On the copper-rich soils of the Democratic Republic of Congo grow copper-tolerant plants whose leaves have been reported to hold around 1,000 mg per kg of dry matter, though some of this may be dust on the leaves."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 29
topic = "wild"
text = "Common bent grass on the spoil of a Welsh copper mine evolved copper-tolerant populations within about a century, very fast by the usual pace of evolution."
source = "epstein1972"

[[plant_note]]
Z = 29
topic = "forest"
text = "Twisted, deformed leading shoots in Douglas-fir have been traced to copper shortage, and in some cases to boron shortage."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 29
topic = "food"
text = "Copper fertilisers can raise copper in food and fodder where people or livestock lack it, but must be used with care, because too much harms plants and animals."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 29
topic = "food"
text = "Sheep are especially sensitive to copper-rich fodder; about 50 mg per kg of dry matter is taken as the upper limit for forage."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_16"

