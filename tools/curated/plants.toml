# --- Selenium (Z = 34) ---
[[plant]]
Z = 34
uptake = "Selenate (SeO₄²⁻) through the plant's sulfate carriers, or selenite (SeO₃²⁻), partly through phosphate carriers"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00012-5"
known_text = "the 1920s, when small doses were reported to stimulate the growth of lupins"
known_source = "barker_pilbeam2015"
known_doi = "10.1201/b18458-23"

[[plant_note]]
Z = 34
topic = "deficiency"
text = "No plant is known to need it, but small doses have helped ryegrass grow, kept lettuce green for longer and, in one experiment, raised the seed yield of Brassica rapa by 43%."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 34
topic = "toxicity"
text = "Most crops cannot store much selenium safely: harm can start below 100 mg per kg of dry matter."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 34
topic = "toxicity"
text = "Plants with too much selenium are stunted and turn yellow; grasses can show snow-white leaves and pink roots."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 34
topic = "soil"
text = "Most soils hold between 0.01 and 2 mg of selenium per kg; seleniferous soils hold more than 5 mg."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 34
topic = "soil"
text = "Plants take up selenate far more readily than selenite; selenate forms in well-aerated alkaline soils, while in acid and neutral soils selenium is held tightly and little is available."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 34
topic = "wild"
text = "Milk vetches (Astragalus), Stanleya and a few other plants of selenium-rich soils store more than 1 g per kg of dry leaf without harm; it may protect them from grazing animals, which it can poison."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 34
topic = "wild"
text = "Such plants are selenium indicators: where they grow, the soil is rich in selenium."
source = "epstein1972"

[[plant_note]]
Z = 34
topic = "food"
text = "Since the mid-1980s Finland has added selenate to all compound fertilisers, which more than doubled the selenium people there take in from cereals, vegetables, meat and milk."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 34
topic = "food"
text = "Up to a billion people may get too little selenium, and plant foods are a main source of it, so enriching crops with selenium (biofortification) matters for health."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

# --- Molybdenum (Z = 42) ---
[[plant]]
Z = 42
uptake = "Molybdate, MoO₄²⁻, which competes with sulfate at the root"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "intermediate"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 0.1
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 4
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1939
known_by = "D. I. Arnon and P. R. Stout"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 42
topic = "deficiency"
text = "Plants look starved of nitrogen, stunted and pale; in cauliflower and other broad-leaved plants the young leaf blades fail to form properly ('whiptail'), and citrus gets 'yellow spot'. Leaves are short below about 0.1–1.0 mg per kg of dry matter, depending on species and nitrogen source."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 42
topic = "toxicity"
text = "Plants tolerate very large amounts: the gap between too little and too much can be ten-thousand-fold. Excess turns shoots golden yellow, and in oilseed rape and tomato it stains the stems blue."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 42
topic = "soil"
text = "Iron oxides hold molybdate tightly in acid soils and release it as the soil becomes less acid: liming from pH 5 to pH 7 raised the molybdenum in soybean shoots tenfold. Sulfate fertilisers such as gypsum compete with it and cut its uptake."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 42
topic = "partners"
text = "Molybdenum is part of nitrogenase, so legumes that fix nitrogen need much more of it; a plant short of it sends what it has to the nodules first. Shortage in nodulating legumes is widespread on acid soils of the humid tropics."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 42
topic = "forest"
text = "Forest soils have not been found short of molybdenum, though some researchers suspect that tropical forests would fix more nitrogen if slightly more were available."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 42
topic = "food"
text = "Fodder with more than about 5–10 mg per kg of dry matter is suspect for cattle and horses: the excess causes a copper deficiency called molybdenosis (the 'teart' pastures of England are an example), and black cattle turn ginger."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_17"

