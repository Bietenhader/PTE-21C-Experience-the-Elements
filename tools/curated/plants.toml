# --- Iron (Z = 26) ---
[[plant]]
Z = 26
uptake = "Fe²⁺, after the root reduces iron at its surface; grasses instead take up Fe³⁺ bound to chelators they release (phytosiderophores)"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "intermediate"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 100
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 4
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1843
known_by = "E. Gris"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 26
topic = "deficiency"
text = "Shortage always starts on the youngest leaves, which turn yellow between still-green veins and, when severe, entirely yellow; cereal leaves get yellow and green stripes. Citrus, fruit trees and grapevines are the crops most often affected."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_13"

[[plant_note]]
Z = 26
topic = "deficiency"
text = "Leaves are short of iron below about 50–150 mg per kg of dry matter. Limy (calcareous) soils are the classic place for it, where it is called lime-induced chlorosis."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 26
topic = "toxicity"
text = "On waterlogged soils so much iron dissolves that rice leaves turn bronze; this 'bronzing' is the second most serious yield limit of wetland rice, often costing 15–30 % of the harvest."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 26
topic = "soil"
text = "Iron is the fourth most common element in the Earth's crust, yet in well-aerated, alkaline soils almost none of it dissolves, so plants depend on iron held by soluble organic molecules (chelates)."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 26
topic = "soil"
text = "Iron salts spread on the soil soon turn into insoluble oxides; sprays on the leaves, or chelates that stay stable at high pH, work better."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_13"

[[plant_note]]
Z = 26
topic = "partners"
text = "Legume nodules need more iron than the rest of the plant, because it is built into nitrogenase, ferredoxin and the red pigment leghaemoglobin."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 26
topic = "wild"
text = "Plants that shun lime (calcifuges), such as azaleas, rhododendrons and blueberries, are particularly prone to yellowing from iron shortage."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_13"

[[plant_note]]
Z = 26
topic = "forest"
text = "In forests iron limits growth only on some alkaline soils and for some tree species, and iron toxicity has not been reported in trees."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 26
topic = "forest"
text = "In eucalypts, iron-short new leaves turn yellow with green veins, without the shoot tip dying back."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 26
topic = "food"
text = "Wheat, rice and maize grains are naturally poor in iron, and fertilising raises their iron far less than their zinc. Phytate, the grain's store of phosphorus, binds iron and zinc, and people cannot digest it, so they absorb less."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

