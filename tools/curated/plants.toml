# --- Zinc (Z = 30) ---
[[plant]]
Z = 30
uptake = "Mainly the zinc ion Zn²⁺"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "intermediate"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 20
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 4
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1926
known_by = "A. L. Sommer and C. B. Lipman"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 30
topic = "deficiency"
text = "Shoots stop lengthening and leaves stay small, so fruit trees form 'little leaf' rosettes, while wheat gets whitish-brown patches on its middle leaves. Leaves are short below about 15–20 mg per kg of dry matter, and maize, rice and apple are among the most sensitive crops."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "toxicity"
text = "Too much zinc is rare in crops and happens mostly near mines and smelters or after sewage sludge. Roots stop lengthening and young leaves yellow, probably because zinc crowds out iron; liming the soil is the best remedy."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "soil"
text = "Shortage is widespread on limy soils and on old, highly weathered acid soils, where zinc clings to clay, iron oxides and lime. Unlike iron shortage, it is easily cured by spreading zinc sulfate on the soil."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "soil"
text = "Heavy phosphate fertilising of zinc-poor soil can bring on zinc shortage."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "partners"
text = "Mycorrhizal fungi can supply up to half of a plant's zinc; heavy phosphate fertilising suppresses them, which is one reason it lowers the zinc in wheat grain."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "partners"
text = "Some mycorrhizal fungi help forest trees and crops tolerate too much zinc by holding it in their own cell walls and vacuoles."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "wild"
text = "Zinc-tolerant strains of tufted hair-grass live on zinc-rich ground by locking the metal away in the vacuoles of their root cells."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 30
topic = "wild"
text = "Bladder campion has races (ecotypes) that differ in how much zinc they tolerate; the tolerance is inherited through several genes."
source = "epstein1972"

[[plant_note]]
Z = 30
topic = "forest"
text = "In eucalypts, zinc shortage makes the new leaves small and crowded, without the shoot tip dying back."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 30
topic = "food"
text = "Wheat, rice and maize grains are naturally low in zinc, and higher-yielding varieties have diluted it further. Zinc sprays on wheat raise the zinc in the grain, best when the crop also gets plenty of nitrogen."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

[[plant_note]]
Z = 30
topic = "food"
text = "In grain much of the zinc is bound to phytate, which people and other animals with a single stomach cannot digest, so less of it is absorbed."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

