# --- Carbon (Z = 6) ---
[[plant]]
Z = 6
uptake = "Carbon dioxide (CO₂) from the air; possibly a little bicarbonate from the soil water"
uptake_source = "mengel_kirkby2001"
uptake_doi = "10.1007/978-94-010-1009-2_1"
job = 1
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, by which time it was known to come from the air"
known_source = "epstein1972"

[[plant_note]]
Z = 6
topic = "forest"
text = "The carbon in wood comes from the air. The amount of carbon dioxide in the atmosphere can itself limit how fast forests grow, a limit that may ease as the gas becomes more plentiful."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

# --- Nitrogen (Z = 7) ---
[[plant]]
Z = 7
uptake = "Nitrate (NO₃⁻) and ammonium (NH₄⁺) from the soil water; legumes also use N₂ from the air, through bacteria in their root nodules"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00019-8"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 15000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 1
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 7
topic = "deficiency"
text = "Plants stay small, with narrow, pale green to yellow leaves; the yellowing starts on the older leaves, because the plant moves their nitrogen to the young ones. Cereals form fewer side shoots and fewer grains per ear."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 7
topic = "toxicity"
text = "Too much ammonium as the only nitrogen source harms many plants: leaves yellow, growth stalls and tissue dies. Barley is sensitive to it, rice tolerant; a little nitrate alongside eases the damage."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 7
topic = "soil"
text = "Soil particles do not hold nitrate, so it travels with the soil water and is easily lost. A crop takes up only about half of the fertiliser nitrogen in the first year; the rest stays in the soil or escapes, as nitrate into waters or as ammonia and nitrous oxide into the air."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 7
topic = "soil"
text = "Factory-made nitrogen fertiliser comes from the Haber–Bosch process, which turns nitrogen from the air into ammonia at high temperature and pressure; it accounts for more than half of the energy used in commercial farming."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 7
topic = "partners"
text = "Only a small group of microbes can turn the air's N₂ into ammonia. Legumes house rhizobia in root nodules; alders, Casuarina, Ceanothus and some 200 other woody plants house Frankia instead, and cycads and the water fern Azolla partner with cyanobacteria."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 7
topic = "wild"
text = "Plants of acid soils and wetlands tend to prefer ammonium, while plants of limy soils prefer nitrate; in acid forest soils, ammonium and amino acids are the main forms of nitrogen on offer."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 7
topic = "forest"
text = "Nitrogen is the nutrient that limits most temperate forests, many boreal ones and some tropical ones; trees get it from nitrate and ammonium released as soil organic matter decays."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 7
topic = "forest"
text = "Without nitrogen-fixing plants a forest gains less than a kilogram of fixed nitrogen per hectare a year; with them, up to several hundred. Alders always carry their nodules, Ceanothus shrubs not always."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 7
topic = "food"
text = "Good nitrogen supply, with part of it given late in the season, raises the gluten proteins in wheat grain and so its baking quality; durum wheat for pasta is wanted with more than 12–13 % protein."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

[[plant_note]]
Z = 7
topic = "food"
text = "Leafy vegetables such as spinach, lettuce and chard, and beetroot, can store a lot of nitrate, and food safety authorities set upper limits for spinach and lettuce; avoiding excess fertiliser and choosing the time of harvest keep levels down."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

