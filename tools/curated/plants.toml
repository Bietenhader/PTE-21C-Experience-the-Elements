# --- Iodine (Z = 53) ---
# No [[plant]] row: the sources give no uptake form, phloem mobility or dated discovery for iodine (see notes_C.md).

[[plant_note]]
Z = 53
topic = "deficiency"
text = "Land plants are not known to need it, but small doses improved the growth and flowering of thale cress (Arabidopsis) in recent experiments, perhaps because it is built into some plant proteins."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 53
topic = "toxicity"
text = "Too much iodine harms the older leaves first: in tomato they yellow and drop while the young ones stay dark green; such levels are far above those in farm soils, so it is not seen in the field."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 53
topic = "wild"
text = "Some seaweeds, unlike land plants, need iodine, and certain red and brown algae store it in special cells."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_20"

[[plant_note]]
Z = 53
topic = "food"
text = "Iodine is one of the four minerals, with iron, zinc and selenium, that efforts to enrich crops (biofortification) most often target against hidden hunger; iodised salt has also worked well."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

[[plant_note]]
Z = 53
topic = "food"
text = "Spraying crops with iodine has raised the iodine content of the harvest in some studies."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00014-9"
