# --- Calcium (Z = 20) ---
[[plant]]
Z = 20
uptake = "The calcium ion Ca²⁺, from the soil water"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00016-2"
phloem = "low"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 5000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 20
topic = "deficiency"
text = "Calcium hardly moves in the phloem, so fast-growing parts that get little water flow — fruits, tubers, enclosed leaves — run short first: tipburn in lettuce, blackheart in celery, blossom-end rot in tomatoes and watermelons, bitter pit in apples."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 20
topic = "deficiency"
text = "In eucalypts the newly expanding leaves show it: the shoot tip dies back and the leaves buckle because their edges stop growing."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 20
topic = "toxicity"
text = "Most plants tolerate a great deal: mature leaves can hold more than a tenth of their dry weight as calcium without harm. Plants of acid soils, however, are hurt at lower levels than lime-loving plants."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 20
topic = "soil"
text = "Soils on limestone and chalk and young marsh soils are rich in calcium; old soils that have been weathered and leached for a long time — such as the Spodosols of cool regions and the Oxisols and Ultisols of the humid tropics — are poor in it."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_11"

[[plant_note]]
Z = 20
topic = "partners"
text = "Calcium signals are part of how a legume recognises its rhizobia and lets them in; in clovers, more calcium raises the root's release of the compounds that switch on the bacteria's nodulation genes."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 20
topic = "wild"
text = "Wild plants split into lime-lovers (calcicoles) of calcareous soils and lime-avoiders (calcifuges) of acid, calcium-poor soils. Often it is not calcium itself that keeps a calcicole off acid soil: Scabiosa columbaria fails there mainly because it cannot stand the dissolved aluminium."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_11"

[[plant_note]]
Z = 20
topic = "forest"
text = "Calcium rarely limits forests: perhaps on some deeply weathered tropical soils (Oxisols) and in some alpine spruce forests."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 20
topic = "forest"
text = "Liming forest soils seldom helps the trees: trials in Finland and Sweden found growth about a tenth lower for 15–20 years, though sugar maples in a long-term trial in Quebec grew better after dolomitic lime."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 20
topic = "food"
text = "Calcium sprays on apple trees cut losses in store: in one trial, bitter pit in stored Cox apples fell from 30 % to about 3 %."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

