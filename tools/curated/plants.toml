# --- Chlorine (Z = 17) ---
[[plant]]
Z = 17
uptake = "Chloride, Cl⁻"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 100
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1954
known_by = "T. C. Broyer and colleagues"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 17
topic = "deficiency"
text = "Leaves wilt, above all at their edges in full sun, and the youngest leaves curl and shrivel; roots stay stubby with many short side roots. Crops with a high need, such as kiwifruit and coconut, are the most at risk."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 17
topic = "deficiency"
text = "The best-known field shortage is in wheat and barley on leached soils of the US Great Plains, where rain brings little chloride; yield losses of 7–10 % in wheat have been reported in the Americas."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 17
topic = "toxicity"
text = "Too much chloride is a worldwide problem of salty soils in dry regions. Most fruit trees, beans and cotton are harmed above about 3.5 g per kg of leaf dry matter, while barley, spinach, lettuce and sugar beet tolerate 20–30 g."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 17
topic = "soil"
text = "Chloride salts dissolve readily and move freely with soil water. Far from the sea, rain brings roughly what a crop needs as a micronutrient; near the coast it brings about ten times more."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 17
topic = "wild"
text = "In a survey of 670 wild plant species from 138 families, the most common leaf chloride level was about 5 g per kg of dry matter, far above the minimum plants need."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 17
topic = "forest"
text = "Trees need chlorine, but never in amounts that limit forest growth."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

# --- Potassium (Z = 19) ---
[[plant]]
Z = 19
uptake = "The potassium ion K⁺, from the soil water; roots pick it out very selectively"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00019-8"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 10000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 19
topic = "deficiency"
text = "Older leaves yellow and then die back from the edges, and plants become very sensitive to strong light; stems lignify poorly, so cereals fall over (lodge) more easily. It is common on sandy, salty and acid soils and where heavy cropping removes much potassium."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 19
topic = "deficiency"
text = "At first the plant only grows more slowly — 'hidden hunger' — before leaf tips and margins die; clover shows scattered dead spots instead. Short plants wilt easily and cope worse with drought, frost and fungal attack."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_10"

[[plant_note]]
Z = 19
topic = "soil"
text = "Shortage is common on light sandy acid soils, highly weathered tropical soils and peats. Some clay minerals trap potassium between their layers so firmly that in one Michigan soil about nine tenths of the fertiliser potassium was locked away."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_10"

[[plant_note]]
Z = 19
topic = "partners"
text = "Potassium helps legumes keep their nodules supplied with sugar; in a review of 20 trials, giving potassium raised their nitrogen fixation by 180 %, mostly through better growth."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 19
topic = "forest"
text = "Potassium stays a free ion in trees and is easily washed out of leaves and soils. It limits forests only here and there, mostly on old soils and where nitrogen and phosphorus fertilisers have been added."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 19
topic = "food"
text = "Enough potassium gives cotton stronger, whiter fibres, and in processing tomatoes it improves the colour and reduces the 'yellow shoulder' disorder."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00020-4"

[[plant_note]]
Z = 19
topic = "food"
text = "Fleshy fruits and tubers need a lot of potassium: too little brings ripening faults such as 'greenback' in tomatoes and lowers many quality traits of potatoes."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

