# --- Oxygen (Z = 8) ---
[[plant]]
Z = 8
uptake = "In carbon dioxide and water, and as oxygen gas (O₂)"
uptake_source = "mengel_kirkby2001"
uptake_doi = "10.1007/978-94-010-1009-2_1"
job = 1
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century; it comes with water and carbon dioxide"
known_source = "epstein1972"

[[plant_note]]
Z = 8
topic = "forest"
text = "Roots draw oxygen from the air in the soil's pores. In wet soil it can only creep in slowly, so waterlogged soils are where oxygen holds trees back."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

# --- Sodium (Z = 11) ---
[[plant]]
Z = 11
uptake = "Na⁺ ions, which enter the roots through the plant's potassium channels and carriers"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00012-5"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "the late 1950s, when Brownell and Wood found that the Australian saltbush Atriplex vesicaria needs traces of it"
known_source = "epstein1972"

[[plant_note]]
Z = 11
topic = "deficiency"
text = "Many C4 plants, such as amaranths and saltbushes, grow poorly, turn pale and may fail to flower without traces of sodium, because their way of concentrating carbon dioxide in the leaf needs it; maize and sugarcane are exceptions."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "deficiency"
text = "Sugar beet, chard and other beets can let sodium do much of potassium's work in the cell sap, and then grow larger, fleshier leaves; most crops, such as maize and beans, cannot."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "toxicity"
text = "Where a dry climate and irrigation concentrate salt, the soil water can hold 50–100 millimoles of sodium per litre, enough to harm most crops."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "toxicity"
text = "Inside the cell, sodium gets in the way of the many enzymes that need potassium; salt-tolerant plants avoid this by locking it away in their vacuoles."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-25"

[[plant_note]]
Z = 11
topic = "soil"
text = "In dry regions, evaporation draws salty water up to the surface; soils with more than 15% of their exchange sites taken by sodium (sodic soils) lose their structure and form crusts that roots, water and air struggle to get through."
source = "barker_pilbeam2015"
doi = "10.1201/b18458-25"

[[plant_note]]
Z = 11
topic = "soil"
text = "Sodium fertiliser pays off mainly for sodium-loving crops such as sugar beet on soils low in potassium; where the soil holds plenty of potassium, yields do not respond."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "partners"
text = "Arbuscular mycorrhizal fungi on the roots lower sodium uptake in both C3 and C4 plants, according to a review of many studies."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "wild"
text = "Many plants of salty places (halophytes) grow better with plenty of sodium, which they store in their cell sap to hold on to water."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

[[plant_note]]
Z = 11
topic = "wild"
text = "Halogeton glomeratus, a poisonous weed of western American rangeland, needs so much salt that sodium is almost a major nutrient for it."
source = "epstein1972"

[[plant_note]]
Z = 11
topic = "food"
text = "Dairy cows need about 2 g of sodium per kg of feed, more than many pasture grasses contain; sodium fertiliser raises it in grasses such as ryegrass, and animals then eat more of the forage."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00012-5"

# --- Magnesium (Z = 12) ---
[[plant]]
Z = 12
uptake = "The magnesium ion Mg²⁺, from the soil water"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00016-2"
phloem = "high"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 2000
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 3
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century, once plants could be grown in nutrient solutions"
known_source = "epstein1972"

[[plant_note]]
Z = 12
topic = "deficiency"
text = "Fully grown leaves turn yellow between the veins while the veins stay green; strong light makes it worse. Many plants fall short below about 1–2 g of magnesium per kg of dry leaf, broad-leaved crops at somewhat higher levels."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 12
topic = "deficiency"
text = "Signs start on the older leaves and move up the plant. In cereals the leaf base first shows small dark green spots on a pale yellow ground, later yellow stripes, with the leaf tips dying."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_12"

[[plant_note]]
Z = 12
topic = "toxicity"
text = "Extra magnesium is parked in the vacuoles, but very high leaf levels can harm plants in a drought, when the magnesium in the working parts of the cell rises enough to slow photosynthesis."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 12
topic = "soil"
text = "Sandy soils hold far less magnesium than clay soils (roughly 0.5 against 5 g per kg), and magnesium washes out of the topsoil even more easily than calcium."
source = "mengel_kirkby2001"
doi = "10.1007/978-94-010-1009-2_12"

[[plant_note]]
Z = 12
topic = "soil"
text = "Potassium, ammonium, calcium, manganese and acidity all hold back the roots' uptake of magnesium; magnesium shortage brought on by potassium is becoming a common sight on farms."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 12
topic = "wild"
text = "On soils formed from serpentine rock, magnesium far outweighs calcium; the vegetation there is sparse and distinctive, with many species found nowhere else, adapted mainly, it seems, to the low calcium and high magnesium."
source = "epstein1972"

[[plant_note]]
Z = 12
topic = "forest"
text = "Magnesium rarely limits forests worldwide, perhaps on some soils formed from pumice."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

[[plant_note]]
Z = 12
topic = "forest"
text = "In Central Europe magnesium shortage became widespread in spruce forests, made worse by air pollution and soil acidification; in spring, the older needles give up magnesium and green colour to the new ones."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

[[plant_note]]
Z = 12
topic = "food"
text = "Grazing animals on low-magnesium pasture can develop grass tetany, a dangerous drop of magnesium in the blood; fertilising the grass with magnesium raises its content easily, and crops richer in magnesium also help people who get too little."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00019-8"

