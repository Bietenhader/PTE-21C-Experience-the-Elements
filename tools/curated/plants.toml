#
# Plants in detail (Biology & ecology panel, "More about plants"; added after v0.1.0).
# FIN REVIEWS THIS FILE — please mark anything wrong, too simple or missing; the app shows it as it stands.
#
# Facts from five plant-nutrition books (keys in tools/sources.toml), every sentence in our own words; none
# of the books' text is in the repository. Each row names its book and, where the book has them, the
# chapter DOI:
#   marschner2023       Marschner's Mineral Nutrition of Plants, 4th ed. (Rengel, Cakmak & White, 2023)
#   mengel_kirkby2001   Principles of Plant Nutrition, 5th ed. (Mengel & Kirkby, 2001)
#   barker_pilbeam2015  Handbook of Plant Nutrition, 2nd ed. (Barker & Pilbeam, 2015)
#   binkley_fisher2020  Ecology and Management of Forest Soils, 5th ed. (Binkley & Fisher, 2020)
#   epstein1972         Mineral Nutrition of Plants: Principles and Perspectives (Epstein, 1972) — history
#                       and the ecology of wild plants only, never for an element's present status
#
# [[plant]] — one per element, the facts "at a glance" (each with its own _source and _doi):
#   uptake          the form roots (or leaves) take it up in
#   phloem          high | intermediate | low | variable — Marschner's Table 3.8 only
#   typical_mg_kg   average concentration in shoot dry matter sufficient for growth — Marschner's Table 1.3
#   job             Mengel & Kirkby's four groups by biochemical job: 1 built into organic matter by
#                   oxidation and reduction; 2 bound as esters; 3 as free ions; 4 in enzymes, passing electrons
#   known_year / known_by / known_text   when it was shown to be needed (Marschner's Table 1.1 for the
#                   micronutrients, Epstein for the classic ten) or, for a beneficial element, to help
#
# [[plant_note]] — sourced sentences by topic: deficiency (too little), toxicity (too much), soil, partners
#   (mycorrhiza, nodules), wild (wild plants), forest, food (crops and food).
#
# [[leaf_level]] — leaf (tissue) levels of one named plant per group (cereals, legumes, vegetables, fruit,
#   conifers, broadleaf), as the book prints them; the pipeline converts the unit to mg/kg. kind says how to
#   read a row: bands = the book's classes (deficient below / adequate from–to / excess above; the gaps are
#   its "low" and "high"), normal = a usual or sufficiency range, critical = the level (or range, up to
#   critical_high) below which the plant is short — for trees, below which stands often respond to fertiliser.
#
# The build stops on an unknown column, topic, group, kind or unit, a fact without its source, levels that do
# not rise, or two rows for one element and group (tools/build_lifeandhistory.py).

# --- Hydrogen (Z = 1) ---
[[plant]]
Z = 1
uptake = "Water (H₂O) from the soil, or from the air when it is very humid"
uptake_source = "mengel_kirkby2001"
uptake_doi = "10.1007/978-94-010-1009-2_1"
job = 1
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_text = "One of the ten elements recognised as essential in the second half of the 19th century; it comes with water"
known_source = "epstein1972"

[[plant_note]]
Z = 1
topic = "forest"
text = "Trees get their hydrogen from water. Free hydrogen ions set how acid a soil is, and soils that are extremely acid or extremely alkaline hold forests back."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch8"

# --- Boron (Z = 5) ---
[[plant]]
Z = 5
uptake = "Uncharged boric acid, B(OH)₃"
uptake_source = "marschner2023"
uptake_doi = "10.1016/b978-0-12-819773-8.00017-4"
phloem = "variable"
phloem_source = "marschner2023"
phloem_doi = "10.1016/b978-0-12-819773-8.00002-2"
typical_mg_kg = 20
typical_source = "marschner2023"
typical_doi = "10.1016/b978-0-12-819773-8.00016-2"
job = 2
job_source = "mengel_kirkby2001"
job_doi = "10.1007/978-94-010-1009-2_1"
known_year = 1923
known_by = "K. Warington"
known_source = "marschner2023"
known_doi = "10.1016/b978-0-12-819773-8.00016-2"

[[plant_note]]
Z = 5
topic = "deficiency"
text = "Growing points suffer first: the youngest leaves and buds are deformed or die, stems thicken or crack, and flowers and young fruit drop. Typical disorders are hollow stem in broccoli, heart rot in sugar beet, brown heart in swede and turnip, and internal cork in apples."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 5
topic = "deficiency"
text = "Grasses such as wheat need several times less boron than clover and most other broad-leaved plants, probably because their cell walls hold less pectin. Boron shortage is thought to be more widespread in crops worldwide than shortage of any other micronutrient."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 5
topic = "toxicity"
text = "Too much boron is common in dry regions, on soils formed from marine sediments and where irrigation water is rich in boron; older leaves yellow and die back from their tips and edges. Tolerance ranges from about 100 mg per kg of leaf dry matter in maize to about 1,000 in squash."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 5
topic = "soil"
text = "Boric acid washes out of soil easily, so shortage is common in rainy regions and the tropics, and on sandy, alkaline or heavily limed soils; dry topsoil also cuts the supply to roots."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

[[plant_note]]
Z = 5
topic = "partners"
text = "Legumes need four to five times more boron to build root nodules than to grow roots, so boron shortage means fewer and poorer nodules and less nitrogen fixed."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00006-x"

[[plant_note]]
Z = 5
topic = "forest"
text = "In Scots pine stands in northern Sweden that were fertilised with nitrogen, boron shortage killed the leading shoots; side shoots took over and the stems grew crooked."
source = "binkley_fisher2020"
doi = "10.1002/9781119455745.ch13"

[[plant_note]]
Z = 5
topic = "food"
text = "Seeds from boron-short plants can look normal yet give more weak or abnormal seedlings, as found in black gram."
source = "marschner2023"
doi = "10.1016/b978-0-12-819773-8.00017-4"

