# SPDX-License-Identifier: CC-BY-NC-SA-4.0
#
# Annual world production and unit value (SPEC §6.2, §10.4), compiled from the USGS data release by a
# script that keeps the CSV line of every number; chlorine is left out (USGS reports salt, not chlorine).
# World production and U.S. price/unit value per element, from USGS Mineral Commodity Summaries 2026.
# Data: U.S. Geological Survey, 2026, Mineral Commodity Summaries 2026 Data Release, https://doi.org/10.5066/P1WKQ63T
#   (ScienceBase item 69837e43b66b01367d7ec7c7, file MCS2026_Commodities_Data.csv, CC0 1.0 / public domain; cp1252-encoded).
# Publication: U.S. Geological Survey, 2026, Mineral commodity summaries 2026 (ver. 1.3, May 2026), https://doi.org/10.3133/mcs2026
# csv_line / price_csv_line = physical line number in the CSV (header = line 1).
# Units: 1 lb = 0.45359237 kg, 1 troy oz = 31.1034768 g, 1 short ton = 907.18474 kg (exact definitions);
#   metric carat = 200 mg and metric ton unit = 10 kg (MCS Appendix A). 'estimated' mirrors the USGS 'e' / 'Estimated.' note.
# unit_value_usd_per_kg is per kg of the MATERIAL named in price_basis (metal, oxide, ore, compound...), not necessarily per kg of the element.
# 2025 values in MCS 2026 are USGS estimates for the full year (USGS: 'For 2025, ... estimates based on available data').

[meta]
edition = "MCS 2026"
edition_version = "ver. 1.3, May 2026"
data_release_doi = "https://doi.org/10.5066/P1WKQ63T"
publication_doi = "https://doi.org/10.3133/mcs2026"
file = "MCS2026_Commodities_Data.csv"
file_sha256 = "582a0aa231aea53d8a97dc8d1cd3dfa5f885cf3760353e3d029d7f0ae4fbaaf5"
licence = "CC0 1.0 (USGS data release metadata: public domain, no use constraints)"
retrieved = "2026-10-21"

[[row]]
Z = 2
symbol = "He"
commodity = "Helium"
mcs_chapter = "HELIUM AND RARE GASES"
primary = true
basis = "world production, helium gas (volume at 101.325 kPa, 15 degC)"
contained_element = true
via_mineral = false
table = "World Production and Reserves"
csv_line = 3287
usgs_row = "World total | Helium Production: rounded | million cubic meters | 2025"
original_value = "190"
original_unit = "million cubic meters"
year = 2025
estimated = true
tonnes_per_year = 32000.0
conversion = "190 million m3 x 10^6 x (0.0047 t / 27.737 m3, USGS footnote, 101.325 kPa, 15 degC) = 32,195 t, reported to 2 significant figures as 32,000 t"
usgs_note = "Estimated."
prev_year_original = "183 million cubic meters"
prev_year = 2024
prev_year_estimated = true
prev_csv_line = 3278
unit_value_usd_per_kg = 70.0
price_basis = "estimated base price for Grade-A helium (excl. f.o.b./transport; producers posted surcharges), chapter prose"
price_original = "about $12 per cubic meter ($330 per thousand cubic feet)"
price_unit = "dollars per cubic meter at 15 degC, 101.325 kPa"
price_conversion = "330 USD per 1,000 ft3 = 27.737 m3 = 0.0047 t (USGS footnote) -> 330 / 4.7 kg = 70.2 USD/kg; from 12 USD/m3: 12 / (4.7 kg / 27.737 m3) = 70.8 USD/kg; given as ~70 USD/kg (2 s.f.)"
price_year = 2025
price_estimated = true
price_source_location = "mcs2026.pdf, Helium and Rare Gases, p. 96 (prose; no CSV price row)"
edition = "MCS 2026"
file = "MCS2026_Commodities_Data.csv"
source = "usgs_mcs"
note = "Helium mass from USGS's own footnote (MCS 2026 p. 97, note 1): at 101.325 kPa, 27.737 m3 of helium at 15 degC = 0.0047 metric tons; that factor has 2 significant figures, so the tonnage is ~32,000 t (arithmetic gives 32,195 t). USGS also states world helium-3 production was an estimated 40,000 liters in 2024 and 2025 (prose, p. 97). U.S. price is from the chapter prose on p. 96 (no CSV price row): 'estimated base price for Grade-A helium was about $12 per cubic meter ($330 per thousand cubic feet) in 2025, with producers posting surcharges'."

