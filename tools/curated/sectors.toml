#
# Elements and three sectors of human technology: the maps "Essential for energy", "Essential for logistics &
# infrastructure" and "Essential for IT, computing & telecom" (added after v0.1.0).
# FIN REVIEWS THIS FILE — please mark anything wrong, too simple or missing.
#
# One [[sector]] row per element and sector:
#   Z        atomic number
#   sector   energy | infrastructure | ict
#   status   essential | important     (an element with no row shows "No role named in PTE-21C's sources")
#   role     one sentence, our own words
#   source   key in tools/sources.toml; page = table or page in that source
#
# How the status is set (a counting rule, not a judgement of substitutes, which these sources do not give):
#   jrc_foresight2023  the JRC's sector tables (Tables 7–10) mark which raw materials each technology of a
#                      sector uses. "essential" = used in every technology the JRC studied for that sector;
#                      "important" = used in some of them. Energy = Table 7 (renewable energy: batteries,
#                      electrolysers, wind turbines, heat pumps, solar PV); infrastructure = Tables 8 and 9
#                      (e-mobility; energy-intensive industry, i.e. green steel); ICT = Table 10. A mineral counts
#                      for the element it is mined for (iron ore -> Fe, baryte -> Ba, fluorspar -> F, potash -> K,
#                      limestone -> Ca, natural graphite -> C); "REE (magnets)" stands for Nd, Pr, Dy and Tb (the
#                      report's magnet rare earths, p. 45). The grouped rows "PGM", "LREE (rest)" and
#                      "HREE (rest)" are left out: the tables do not say which members each technology uses.
#   usgs_mcs           a few clear end-use statements of the USGS Mineral Commodity Summaries 2026 (Cu, Fe, Al,
#                      Zn, Pb for infrastructure; Ca for cement and concrete, from the Cement, Stone (crushed) and
#                      Gypsum chapters; uranium, the fuel of nuclear power, for energy). These rows are "essential"
#                      where the use is a main one of the element in that sector (the sentence says which).
#   graedel2015basis, graedel2015criticality   Graedel et al., PNAS 2015 (Fin's copies): a use named in the
#                      paper's text or Table 1 (tungsten carbide tools; niobium in steel); always "important".
#   iea_critical_minerals2021   pages of the IEA report Fin sent (IEA, all rights reserved: facts only): which
#                      minerals batteries, grids, solar, wind, nuclear and fossil plants use; never changes a status.
#   eia_energy_explained   US EIA "Energy Explained" pages (public domain): fossil fuels as carbon and hydrocarbons,
#                      hydrogen as an energy carrier (C and H for energy; "important" — Fin to decide on "essential").
#
# The JRC sentences were generated from the tables (which technologies use each raw material), then read through;
# edit by hand from here on.

