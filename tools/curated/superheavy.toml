J = 2
coupling = "LS"
ie1_eV = 6.855
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level and IE1 from Smits et al. 2023 (review); configuration written there as [Cn] 7p1/2^2 7p3/2^2. J = 2 confirmed by Dzuba, Flambaum & Vong 2025 (J = 0 lies 6605 cm-1 higher); the review's own Table 3 labels the Lv state psi_{J=0}, which contradicts its Table 2. IE1 from Borschevsky et al. 2015 (FSCC; not read). Independent CIPT+SD: 54 433 cm-1 = 6.749 eV (Dzuba et al. 2025)."

