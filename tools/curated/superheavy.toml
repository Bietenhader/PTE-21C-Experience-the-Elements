# Predicted ground levels and first ionization energies for Z = 109-118 (no NIST data).
#
# Ground configuration / ground level: one consistent source for all ten elements,
#   O. R. Smits, P. Indelicato, W. Nazarewicz, M. Piibeleht, P. Schwerdtfeger,
#   "Pushing the limits of the periodic table - A review on atomic relativistic electronic
#   structure theory and calculations for the superheavy elements", Phys. Rep. 1035, 1-57 (2023),
#   doi:10.1016/j.physrep.2023.09.004 (Crossref-confirmed); read as arXiv:2301.02553v1, Table 2
#   (LaTeX label tab:properties1). [No] = [Rn] 5f14 7s2 and [Cn] = [Rn] 5f14 6d10 7s2 in that table;
#   configurations below are written out in full. Each level was cross-checked against a primary paper.
#   The review's term symbols are nominal LS labels; for 7p elements the state is close to the jj limit
#   (dominant CSFs in the review's Table 3), so treat the LS label as a name, not as LS coupling.
#
# First ionization energy: where Smits et al.'s value can be traced to a primary paper that was read
#   and that gives an uncertainty, that paper is cited (separate row, own doi). Otherwise Smits et al.
#   is cited and no uncertainty is given. One deliberate departure: Rg (see its rows).
#
# Unit conversions (Mt, Ds): 1 hartree = 27.211386245988 eV (CODATA 2018).
# All rows are THEORETICAL PREDICTIONS; there are no measurements for any of these elements.

# ---------------------------------------------------------------- 109 Mt
# evidence: arXiv:2301.02553v1 Table 2, "109 & Mt & [No]$6d^7 (^4F_{9/2})$ & 10.4 & - & 34.2 & \cite{Dzuba2016,Lackenby2019a}"
# cross-check: arXiv:1902.06819v2 (Lackenby, Dzuba, Flambaum, PRA 99, 042509 (2019)) Sec. V.D,
#   "[Rn]5f 14 6d7 7s2 4 F9/2 which we confirm in the calculated spectrum presented in Table IV"
[[row]]
Z = 109
configuration = "[Rn] 5f14 6d7 7s2"
ground_level = "4F9/2"
J = 4.5
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level (Smits et al., Phys. Rep. 2023, review; arXiv:2301.02553 Table 2). Confirmed by CIPT calculation of Lackenby, Dzuba & Flambaum (PRA 99, 042509, 2019). The review does not resolve 6d3/2 vs 6d5/2 occupation for Z = 105-110."

# evidence: arXiv:1602.08190v1 (Dzuba, PRA 93, 032519 (2016)) Table IV "Final values ... including uncertainies.
#   All numbers are in atomic units", row "109 Mt 6d7 7s2 0.38(4) 34(3)"
# 0.38(4) hartree = 10.34(1.09) eV, written as 10.3(1.1) to keep the paper's two significant figures.
[[row]]
Z = 109
ie1_eV = 10.3
ie1_unc_eV = 1.1
source = "primary_literature"
doi = "10.1103/PhysRevA.93.032519"
note = "Predicted IE1, relativistic Hartree-Fock + RPA with semi-empirical core polarization (Dzuba 2016), final value 0.38(4) a.u. converted to eV. Smits et al. 2023 list 10.4 eV = Dzuba's Table III value 0.383 a.u. Newer CIPT value 9.86 eV (Lackenby et al. 2019, arXiv:1902.06819 Table VIII) lies inside the uncertainty."

# ---------------------------------------------------------------- 110 Ds
# evidence: arXiv:2301.02553v1 Table 2, "110 & Ds & [No]$6d^8 (^3F_4)$ & 9.562 & 0.830 & 32.3 & \cite{arbely2018PhD}"
# cross-check (level): arXiv:1910.01414v1 (Lackenby, Dzuba, Flambaum, PRA 101, 012514 (2020)) Table VIII,
#   "Ds I 6d8 7s2 3F4 81 933" (IP in cm-1)
[[row]]
Z = 110
configuration = "[Rn] 5f14 6d8 7s2"
ground_level = "3F4"
J = 4
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level (Smits et al. 2023, review, Table 2), confirmed by the CIPT calculation of Lackenby et al. 2020."

# evidence: arXiv:1602.08190v1 (Dzuba, PRA 93, 032519 (2016)) Table IV final values in atomic units, Ds: "0.41(4)"
# 0.41(4) hartree = 11.16(1.09) eV, written as 11.2(1.1).
[[row]]
Z = 110
ie1_eV = 11.2
ie1_unc_eV = 1.1
source = "primary_literature"
doi = "10.1103/PhysRevA.93.032519"
note = "Predicted IE1 (Dzuba 2016, final value 0.41(4) a.u. converted to eV). Other predictions: 9.562 eV (cited by the Smits et al. review from a 2018 PhD thesis we have not read) and 10.16 eV (CIPT, Lackenby et al. 2020); all lie within this uncertainty."

# ---------------------------------------------------------------- 111 Rg
# evidence: arXiv:2301.02553v1 Table 2, "111 & Rg & [No]$6d^4_{3/2}d^5_{5/2} (^2D_\frac{5}{2})$ & 11.03 & 1.97 & 30.6 & \cite{Kaygorodov2022,eliav2011electronic,Dzuba2016}"
# cross-check: arXiv:2202.08304v1 (Kaygorodov et al., PRA 105, 062805 (2022)) Table III caption
#   "The ground-state configuration of the neutral Rg atom is 6d9 7s2 J = 5/2"; arXiv:1910.01414v1 Sec. III
#   "Rg I has a ground state of 6d9 7s2 (2 D5/2 )"
[[row]]
Z = 111
configuration = "[Rn] 5f14 6d9 7s2"
ground_level = "2D5/2"
J = 2.5
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level (Smits et al. 2023, review). The review writes the configuration jj-resolved as [No] 6d3/2^4 6d5/2^5, i.e. one hole in 6d5/2. Confirmed by Kaygorodov et al. 2022 (FS-CCSDT) and Lackenby et al. 2020 (CIPT)."

# evidence: arXiv:2202.08304v1 Table III, I1(Rg): "FS-CCSD 11.03(6)", "Triples -0.40(11)", ..., "Total 10.67(13)"
[[row]]
Z = 111
ie1_eV = 10.67
ie1_unc_eV = 0.13
source = "primary_literature"
doi = "10.1103/PhysRevA.105.062805"
note = "Predicted IE1, relativistic Fock-space coupled cluster FS-CCSDT + Breit + model-QED (Kaygorodov et al. 2022), final 'Total'. NOTE: Smits et al. 2023 list 11.03 eV, which is the FS-CCSD line of the same table before the -0.40(11) eV triples correction; the authors' final value is used here. CIPT gives 11.175 eV (Lackenby et al. 2020)."

# ---------------------------------------------------------------- 112 Cn
# evidence: arXiv:2301.02553v1 Table 2, "112 & Cn & [No]$6d^{10} (^1S_0)$ & 12.02 & 0 & 27.64 & \cite{Kaygorodov2022,Pershina2008,eliav2011electronic}"
# cross-check: arXiv:2202.08304v1 Sec. IV.B "For neutral and singly ionized copernicium the obtained ground-state
#   configurations are 6d10 7s2 and 6d9 7s2 J = 5/2"
[[row]]
Z = 112
configuration = "[Rn] 5f14 6d10 7s2"
ground_level = "1S0"
J = 0
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted closed-shell ground level (Smits et al. 2023, review); confirmed by Kaygorodov et al. 2022."

# evidence: arXiv:2202.08304v1 Table IV, columns I2(Cn) I1(Cn): "Total 22.41(11) 12.02(5)"
[[row]]
Z = 112
ie1_eV = 12.02
ie1_unc_eV = 0.05
source = "primary_literature"
doi = "10.1103/PhysRevA.105.062805"
note = "Predicted IE1, FS-CCSDT + Breit + model-QED (Kaygorodov et al. 2022), final 'Total'; same value as Smits et al. 2023."

# ---------------------------------------------------------------- 113 Nh
# evidence: arXiv:2301.02553v1 Table 2, "113 & Nh & [Cn]$7p_\frac{1}{2}^1 (^2P_\frac{1}{2})$ & 7.49 & 0.73 & 29.85 & ..."
# cross-check: arXiv:1608.03048v2 (Dzuba & Flambaum, Hyperfine Interact. 237, 160 (2016)) Table 3,
#   "E113, I.P. = 7.37 eV", ground state "7s2 7p 2 Po1/2 0"
[[row]]
Z = 113
configuration = "[Rn] 5f14 6d10 7s2 7p1"
ground_level = "2P1/2"
J = 0.5
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level (Smits et al. 2023, review), configuration written there as [Cn] 7p1/2^1. Odd parity (Dzuba & Flambaum 2016 label it 2P°1/2)."

# evidence: arXiv:2202.08304v1 Table V, columns I3 I2 I1 eps: "Total 33.37(7) 23.84(6) 7.49(5) 0.73(4)"
[[row]]
Z = 113
ie1_eV = 7.49
ie1_unc_eV = 0.05
source = "primary_literature"
doi = "10.1103/PhysRevA.105.062805"
note = "Predicted IE1, FS-CCSDT + Breit + model-QED (Kaygorodov et al. 2022); same as Smits et al. 2023. Independent CC study gives 7.569(48) eV (Guo et al., J. Phys. B 55, 155003 (2022), arXiv:2202.01294); the two differ by slightly more than their combined uncertainties."

# ---------------------------------------------------------------- 114 Fl
# evidence: arXiv:2301.02553v1 Table 2, "114 & Fl & [Cn]$7p_\frac{1}{2}^2 (^1S_0)$ & 8.65 & 0 & 30.59 & ..."
#   and Table 3 "114 & Fl & $\psi_{J=0}=0.9955\phi(7p^2_{1/2})-0.095\phi(7p^2_{3/2})$"
# cross-check: arXiv:1608.03048v2 Table 4 "E114, I.P. = 8.37 eV", ground "7s2 7p2 1S 0"
[[row]]
Z = 114
configuration = "[Rn] 5f14 6d10 7s2 7p2"
ground_level = "1S0"
J = 0
coupling = "LS"
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level (Smits et al. 2023, review). The label 1S0 is nominal: the state is ~99% 7p1/2^2, i.e. close to the jj level (1/2,1/2)0, with strong 3P/1S mixing (review text)."

# evidence: arXiv:2202.08304v1 Table VI, columns I4 I3 I2 I1: "Total 46.05(7) 35.56(7) 16.92(6) 8.65(5)"
[[row]]
Z = 114
ie1_eV = 8.65
ie1_unc_eV = 0.05
source = "primary_literature"
doi = "10.1103/PhysRevA.105.062805"
note = "Predicted IE1, FS-CCSDT + Breit + model-QED (Kaygorodov et al. 2022); same as Smits et al. 2023. CI+LCCSD gives 8.37 eV (Dzuba & Flambaum 2016)."

# ---------------------------------------------------------------- 115 Mc
# evidence: arXiv:2301.02553v1 Table 2, "115 & Mc & [Cn]$7p_\frac{1}{2}^2p_\frac{3}{2}^1 (^2P_\frac{3}{2})$ & 5.574 & 0.313 & 70.5 & \cite{Borschevsky2015Lv,Dzuba2016Mc}"
# cross-check: arXiv:1608.03048v2 Table 5 "E115, I.P. = 5.56 eV", ground "7p3 2 Po3/2 0";
#   Table 6 "E115 5.56 5.574 [18]" with [18] = Borschevsky et al., PRA 91, 020501(R) (2015)
[[row]]
Z = 115
configuration = "[Rn] 5f14 6d10 7s2 7p3"
ground_level = "2P3/2"
J = 1.5
coupling = "LS"
ie1_eV = 5.574
source = "primary_literature"
doi = "10.1016/j.physrep.2023.09.004"
note = "Predicted ground level and IE1 from Smits et al. 2023 (review); configuration written there as [Cn] 7p1/2^2 7p3/2^1. IE1 originates in Borschevsky et al., PRA 91, 020501 (2015), doi:10.1103/PhysRevA.91.020501 (FSCC; not on arXiv, not read; same number quoted in Dzuba & Flambaum 2016 Table 6). Independent CI+LCCSD: 5.56 eV. Odd parity (2P°3/2 in Dzuba & Flambaum; their Fig. 3 caption says 4S°3/2, contradicting their Table 5)."

# ---------------------------------------------------------------- 116 Lv
# evidence: arXiv:2301.02553v1 Table 2, "116 & Lv & [Cn]$7p_\frac{1}{2}^2p_\frac{3}{2}^2 (^3P_2)$ & 6.855 & 0.776 & - & \cite{Borschevsky2015Lv}"
# cross-check: arXiv:2505.22895v2 (Dzuba, Flambaum, Vong, PRA 112, 012822 (2025)) Table V, "7p4 3P 2 0" and J=0 at "6605";
#   Table VIII "Lv 54433 ... 55290 [6]" (cm-1), [6] = Borschevsky et al. PRA 91, 020501 (2015); 55290 cm-1 = 6.855 eV
