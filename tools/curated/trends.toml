#
# Trend definitions (SPEC §8) → public/data/trends.json via tools/build_trends.py.
# Arrow trends follow the table in SPEC §8.1; the causes are written in our own words. Arrow claims that
# our data can test (IE₁, electronegativity, radius) are checked against the data by
# tools/tests/test_trends.py. Heatmaps name an index.json field; categorical maps are computed by
# build_trends.py from index.json so the app only draws them.
#
# arrow.axis: "across" = along a period, left to right; "down" = down a group.
# arrow.region: "all", or for reactivity "metals" (left of the table) / "nonmetals" (right).

[[arrow]]
id = "atomic-radius"
label = "Atomic radius"
cause = "Across a period each step adds a proton and an electron to the same shell, and the stronger pull draws that shell in; down a group every period adds a new, larger shell."
arrows = [
  { axis = "across", direction = "decreases", region = "all" },
  { axis = "down", direction = "increases", region = "all" },
]
exceptions = [
  { symbols = ["Ga"], note = "d-block contraction: the ten 3d electrons shield poorly, so gallium is barely larger than aluminium." },
  { symbols = ["Hf"], note = "Lanthanide contraction: the fourteen 4f electrons shield poorly, so hafnium is almost the size of zirconium." },
]

[[arrow]]
id = "ie1"
label = "First ionization energy"
cause = "Across a period the outermost electron feels a growing effective nuclear charge in the same shell; down a group it sits in a larger shell, farther out and better shielded."
arrows = [
  { axis = "across", direction = "increases", region = "all" },
  { axis = "down", direction = "decreases", region = "all" },
]
exceptions = [
  { symbols = ["B"], note = "Lower than beryllium: boron's outermost electron is in 2p, higher in energy and better shielded than 2s." },
  { symbols = ["O"], note = "Lower than nitrogen: oxygen's fourth 2p electron has to share an orbital, and the pair repels." },
  { symbols = ["Al"], note = "Lower than magnesium, for the same reason as boron (3p after 3s)." },
  { symbols = ["S"], note = "Lower than phosphorus, for the same reason as oxygen (pairing in 3p)." },
]

[[arrow]]
id = "electron-affinity"
label = "Electron affinity"
cause = "An added electron is held more strongly where the effective nuclear charge is higher and the shell smaller; the pattern is irregular because filled and half-filled subshells resist an extra electron."
arrows = [
  { axis = "across", direction = "increases", region = "all", label = "increases (in general)" },
  { axis = "down", direction = "decreases", region = "all", label = "decreases (weakly)" },
]
exceptions = [
  { symbols = ["He", "Ne", "Ar", "Kr", "Xe", "Rn"], note = "Noble gases: an extra electron would have to start a new shell; no stable negative ion forms." },
  { symbols = ["N"], note = "Nitrogen: the half-filled 2p subshell means the added electron must pair." },
  { symbols = ["Be", "Mg", "Ca", "Sr", "Ba", "Ra"], note = "Group 2: the filled s subshell means the added electron must enter the higher p subshell." },
]

[[arrow]]
id = "electronegativity"
label = "Electronegativity (Pauling)"
cause = "Electronegativity measures how strongly an atom in a bond pulls shared electrons towards itself, so it follows the same reasoning about nuclear charge and size as the ionization energy."
arrows = [
  { axis = "across", direction = "increases", region = "all" },
  { axis = "down", direction = "decreases", region = "all" },
]
exceptions = []

[[arrow]]
id = "metallic-character"
label = "Metallic character"
cause = "Metals give up electrons easily; that becomes easier as the outermost electrons are held more loosely, towards the lower left of the table."
arrows = [
  { axis = "across", direction = "decreases", region = "all" },
  { axis = "down", direction = "increases", region = "all" },
]
exceptions = []

[[arrow]]
id = "nonmetallic-character"
label = "Nonmetallic character"
cause = "The mirror image of metallic character: atoms that hold on to electrons and gain them readily lie towards the upper right."
arrows = [
  { axis = "across", direction = "increases", region = "all" },
  { axis = "down", direction = "decreases", region = "all" },
]
exceptions = []

[[arrow]]
id = "zeff"
label = "Effective nuclear charge (valence)"
cause = "Each step across adds a proton but only weak shielding from the new electron in the same shell; down a group the extra protons are largely balanced by the added inner shells."
arrows = [
  { axis = "across", direction = "increases", region = "all" },
  { axis = "down", direction = "about constant", region = "all" },
]
exceptions = []

[[arrow]]
id = "shielding"
label = "Shielding"
cause = "Inner electrons screen the nucleus: across a period their number stays the same, while down a group each new period adds a complete inner shell."
arrows = [
  { axis = "across", direction = "about constant", region = "all" },
  { axis = "down", direction = "increases", region = "all" },
]
exceptions = []

[[arrow]]
id = "polarizability"
label = "Polarizability"
cause = "Larger, more loosely held electron clouds are easier to distort with an electric field, so polarizability follows atomic size."
arrows = [
  { axis = "across", direction = "decreases", region = "all" },
  { axis = "down", direction = "increases", region = "all" },
]
exceptions = []

[[arrow]]
id = "ionic-radius"
label = "Ionic radius (same charge)"
cause = "For ions of the same charge the reasoning for atoms holds: more nuclear charge pulls the same shell in, and a new shell makes the ion larger."
arrows = [
  { axis = "across", direction = "decreases", region = "all" },
  { axis = "down", direction = "increases", region = "all" },
]
exceptions = []

[[arrow]]
id = "reactivity"
label = "Reactivity"
cause = "Metals react by losing electrons, which gets easier down a group; nonmetals react by gaining electrons, which gets harder down a group."
arrows = [
  { axis = "down", direction = "increases", region = "metals", label = "metals" },
  { axis = "down", direction = "decreases", region = "nonmetals", label = "nonmetals" },
]
exceptions = [
  { symbols = ["He", "Ne", "Ar", "Kr", "Xe", "Rn"], note = "Noble gases: filled shells make them largely unreactive." },
]

