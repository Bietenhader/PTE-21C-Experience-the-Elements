  { Z = 67, symbol = "Ho", text = "Nuclear control rods and permanent magnets.", source = "usgs_mcs" },

  { Z = 68, symbol = "Er", text = "Optical fibre and optical amplifiers.", source = "usgs_mcs" },
  { Z = 68, symbol = "Er", text = "Lasers, and a colourant for glass.", source = "usgs_mcs" },

  { Z = 69, symbol = "Tm", text = "Lasers.", source = "usgs_mcs" },
  { Z = 69, symbol = "Tm", text = "X-ray devices, and metallurgy.", source = "usgs_mcs" },

  { Z = 70, symbol = "Yb", text = "Catalysts, lasers, metallurgy and scintillators (crystals that flash when radiation passes).", source = "usgs_mcs" },
  { Z = 70, symbol = "Yb", text = "Ytterbium ions and atoms run optical clocks; the BIPM recommends their frequencies as secondary representations of the second.", source = "bipm_frequencies" },

  { Z = 71, symbol = "Lu", text = "Cancer therapies.", source = "usgs_mcs" },
  { Z = 71, symbol = "Lu", text = "Medical imaging and electronics.", source = "usgs_mcs" },

  { Z = 72, symbol = "Hf", text = "The leading use of hafnium metal is in superalloys for aerospace.", source = "usgs_mcs" },
  { Z = 72, symbol = "Hf", text = "Control rods of nuclear reactors.", source = "usgs_mcs" },
  { Z = 72, symbol = "Hf", text = "Semiconductors and ceramics.", source = "usgs_mcs" },

  { Z = 73, symbol = "Ta", text = "Capacitors for electronics.", source = "usgs_mcs" },
  { Z = 73, symbol = "Ta", text = "Metallurgy, including tantalum alloys and carbides.", source = "usgs_mcs" },
  { Z = 73, symbol = "Ta", text = "It resists almost all chemical attack, so it is used for chemical-plant equipment.", source = "pubchem" },

  { Z = 74, symbol = "W", text = "About 60 % becomes cemented carbide for cutting and wear-resistant tools in construction, metalworking, mining and drilling.", source = "usgs_mcs" },
  { Z = 74, symbol = "W", text = "Alloys and specialty steels.", source = "usgs_mcs" },
  { Z = 74, symbol = "W", text = "Electrodes, filaments, wires and heating elements, and welding.", source = "usgs_mcs" },

  { Z = 75, symbol = "Re", text = "Superalloys for the hot turbine parts of jet engines and gas turbines (about 80 % of use).", source = "usgs_mcs" },
  { Z = 75, symbol = "Re", text = "Platinum–rhenium catalysts that turn petroleum into high-octane petrol (15 %).", source = "usgs_mcs" },
  { Z = 75, symbol = "Re", text = "Thermocouples, electrical contacts and filaments.", source = "usgs_mcs" },

  { Z = 76, symbol = "Os", text = "Almost all osmium goes into very hard alloys with other platinum metals, for pen nibs, instrument pivots and electrical contacts.", source = "pubchem" },
  { Z = 76, symbol = "Os", text = "Osmium tetroxide stains fatty tissue for microscopy and reveals fingerprints; it is very poisonous.", source = "pubchem" },

  { Z = 77, symbol = "Ir", text = "Coatings on the anodes of electrochemical plants, and chemical catalysts.", source = "usgs_mcs" },
  { Z = 77, symbol = "Ir", text = "Hardens platinum; iridium crucibles withstand very high temperatures.", source = "pubchem" },
  { Z = 77, symbol = "Ir", text = "Iridium-192 gamma rays inspect welds and castings for flaws, and treat cancer from inside the body.", source = "pubchem" },

  { Z = 78, symbol = "Pt", text = "Car catalytic converters are the leading use of the platinum-group metals.", source = "usgs_mcs" },
  { Z = 78, symbol = "Pt", text = "Catalysts in chemical plants and oil refineries.", source = "usgs_mcs" },
  { Z = 78, symbol = "Pt", text = "Jewellery, investment, aerospace alloys, glassmaking equipment, and medical and dental devices.", source = "usgs_mcs" },

  { Z = 79, symbol = "Au", text = "Jewellery, and gold leaf for gilding.", source = "pubchem" },
  { Z = 79, symbol = "Au", text = "Coins, and a standard of value in monetary systems.", source = "pubchem" },
  { Z = 79, symbol = "Au", text = "It conducts well and does not tarnish, so it is used for electrical connectors; also in dentistry.", source = "pubchem" },
  { Z = 79, symbol = "Au", text = "Thin gold films reflect infrared radiation on satellites.", source = "pubchem" },

  { Z = 80, symbol = "Hg", text = "Relays, sensors, switches and valves took 65 % of the mercury in U.S. products; dental amalgam 27 %.", source = "usgs_mcs" },
  { Z = 80, symbol = "Hg", text = "Some chlorine plants still use a mercury cathode; mercury is also a catalyst.", source = "usgs_mcs" },
  { Z = 80, symbol = "Hg", text = "Lamps (1 %).", source = "usgs_mcs" },

  { Z = 81, symbol = "Tl", text = "Thallium-201 images blood flow to the heart.", source = "usgs_mcs" },
  { Z = 81, symbol = "Tl", text = "Thallium-doped sodium iodide crystals detect gamma rays; thallium compounds make infrared lenses and windows.", source = "usgs_mcs" },
  { Z = 81, symbol = "Tl", text = "Raises the refractive index of glass; very dense thallium solutions separate minerals by density.", source = "usgs_mcs" },

  { Z = 82, symbol = "Pb", text = "Lead-acid batteries take about two-thirds (67 %): car starter batteries, standby power and motive power.", source = "usgs_mcs" },
  { Z = 82, symbol = "Pb", text = "Ammunition, ceramics and glass.", source = "usgs_mcs" },
  { Z = 82, symbol = "Pb", text = "Its density makes it a shield against X-rays and gamma rays.", source = "pubchem" },

  { Z = 83, symbol = "Bi", text = "Mostly as chemicals: stomach remedies (bismuth subsalicylate), cosmetics and pigments.", source = "usgs_mcs" },
  { Z = 83, symbol = "Bi", text = "A non-toxic replacement for lead in brass plumbing fittings, solders and free-machining steels.", source = "usgs_mcs" },
  { Z = 83, symbol = "Bi", text = "Low-melting bismuth alloys trigger fire sprinklers.", source = "usgs_mcs" },

  { Z = 84, symbol = "Po", text = "Polonium-210 removes static electricity in machinery that rolls paper, sheet metal or wire.", source = "pubchem" },
  { Z = 84, symbol = "Po", text = "Sealed in brushes that clean dust from photographic film.", source = "pubchem" },
  { Z = 84, symbol = "Po", text = "With beryllium it makes a neutron source.", source = "pubchem" },

  { Z = 85, symbol = "At", text = "Astatine-211 has been studied for radiotherapy of thyroid disease and cancer.", source = "pubchem" },
  { Z = 85, symbol = "At", text = "Otherwise no use outside basic research: only tiny amounts are made, and they are short-lived.", source = "pubchem" },

  { Z = 86, symbol = "Rn", text = "Small amounts have been used in hospitals to treat some cancers, sealed in tiny tubes placed in or near a tumour.", source = "pubchem" },
  { Z = 86, symbol = "Rn", text = "For this it is collected from radium, which gives off radon continuously.", source = "pubchem" },

  { Z = 87, symbol = "Fr", text = "No use outside basic research: only tiny amounts have ever been made.", source = "pubchem" },
  { Z = 87, symbol = "Fr", text = "Francium atoms have been laser-cooled and trapped (first in 1996) for precision measurements in atomic physics.", source = "primary_literature", doi = "10.1103/PhysRevLett.76.3522" },

  { Z = 88, symbol = "Ra", text = "Radium-226 was used to treat cancer from close range (brachytherapy), sealed in needles or seeds.", source = "pubchem" },
  { Z = 88, symbol = "Ra", text = "Formerly in self-luminous paint for watch and instrument dials, now replaced by safer sources.", source = "pubchem" },
  { Z = 88, symbol = "Ra", text = "With beryllium it makes a neutron source; the old unit of radioactivity, the curie, was based on radium-226.", source = "pubchem" },

  { Z = 89, symbol = "Ac", text = "Actinium-225 is used against cancer: bound to a carrier molecule, its alpha particles and those of its decay products kill tumour cells.", source = "pubchem" },
