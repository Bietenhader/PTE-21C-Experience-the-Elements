  { Z = 63, symbol = "Eu", text = "Europium oxide is the red phosphor of television screens; europium absorbs neutrons well.", source = "pubchem" },

  { Z = 64, symbol = "Gd", text = "Medical imaging.", source = "usgs_mcs" },
  { Z = 64, symbol = "Gd", text = "Metallurgy and permanent magnets.", source = "usgs_mcs" },
  { Z = 64, symbol = "Gd", text = "It captures slow neutrons better than any other element, which suits it to reactor control rods.", source = "pubchem" },

  { Z = 65, symbol = "Tb", text = "Permanent magnets.", source = "usgs_mcs" },
  { Z = 65, symbol = "Tb", text = "Lasers, optical fibre and solid-state devices.", source = "usgs_mcs" },

  { Z = 66, symbol = "Dy", text = "Permanent magnets.", source = "usgs_mcs" },
  { Z = 66, symbol = "Dy", text = "Data storage devices and lasers.", source = "usgs_mcs" },

