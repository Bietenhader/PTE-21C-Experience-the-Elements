notes = "Effective ionic radii (not crystal radii) of the ions in the elements' common oxidation states, in tools/curated/ionic_radii.toml, transcribed via the mendeleev package 1.3.0 (MIT), whose metadata cites Shannon (1976) for this table (and Lundberg 2016 for some additions, not marked per row). Not re-checked against the printed table."

