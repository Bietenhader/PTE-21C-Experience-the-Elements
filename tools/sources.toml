# SPDX-License-Identifier: CC-BY-NC-SA-4.0
#
# The sources registry (SPEC §6.1). Single source of truth for provenance:
# every `source` in public/data/*.json must be a key of this file, and CI fails otherwise.
#
# Fields: title, url, licence, licence_url, citation, kind, notes.
#   kind = "fetched"  → a tools/fetch_*.py script downloads it; the pipeline sets `retrieved`.
#          "curated"  → values are transcribed by hand into tools/curated/*.toml, one row each.
#          "reference"→ cited for definitions or conventions; no rows are read from it.
# `retrieved` and `version` are written into public/data/sources.json by tools/build.py.

[pubchem]
title = "PubChem Periodic Table of Elements and element pages"
url = "https://pubchem.ncbi.nlm.nih.gov/periodic-table/"
licence = "Public domain (U.S. Government work)"
licence_url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
citation = "PubChem, National Center for Biotechnology Information, U.S. National Library of Medicine. Periodic Table of Elements. https://pubchem.ncbi.nlm.nih.gov/periodic-table/"
kind = "fetched"
notes = "REST: rest/pug/periodictable/JSON (one request) and rest/pug_view/data/element/{Z}/JSON (one per element). PubChem aggregates data from Jefferson Lab and Los Alamos National Laboratory (both U.S. DOE); the oxidation-state lists used here come from those two contributors via PubChem."

# --- Chemistry & bonding (SPEC §10.9) ------------------------------------------------------------

[hsdb]
title = "Hazardous Substances Data Bank (HSDB), records of the elemental substances in PubChem"
url = "https://pubchem.ncbi.nlm.nih.gov/source/hsdb"
licence = "Public domain (U.S. Government work, National Library of Medicine)"
licence_url = "https://www.nlm.nih.gov/web_policies.html"
citation = "Hazardous Substances Data Bank (HSDB), U.S. National Library of Medicine, via PubChem (National Center for Biotechnology Information): compound records of the elemental substances, sections Stability/Shelf Life, Other Experimental Properties and Reactivities and Incompatibilities. https://pubchem.ncbi.nlm.nih.gov/source/hsdb"
kind = "fetched"
notes = "tools/fetch_pubchem_hsdb.py caches the 'Experimental Properties' part of the PubChem record of each elemental substance (found by name). The reactivity notes in tools/curated/chemistry.toml restate what these records say in our own words; no HSDB sentence is copied. The build checks that each note citing hsdb has an HSDB record behind it."

[cameo_chemicals]
title = "CAMEO Chemicals (NOAA), records of the elemental substances in PubChem"
url = "https://cameochemicals.noaa.gov/"
licence = "Free for use (U.S. NOAA); facts restated in our own words, no text copied — some CAMEO data is under its providers' copyright"
licence_url = "https://cameochemicals.noaa.gov/help/reference/terms_and_conditions.htm"
citation = "CAMEO Chemicals, Office of Response and Restoration, U.S. National Oceanic and Atmospheric Administration, with the U.S. EPA, via PubChem: sections Air and Water Reactions and Reactive Group of the elemental substances. https://cameochemicals.noaa.gov/"
kind = "fetched"
notes = "tools/fetch_pubchem_hsdb.py caches the 'Stability and Reactivity' part of each elemental substance's PubChem record, where CAMEO Chemicals describes reactions with air and water. Used only as the grounding of our own-words notes in tools/curated/chemistry.toml."

[pubchem_compounds]
title = "PubChem Compound records (formulas of named compounds)"
url = "https://pubchem.ncbi.nlm.nih.gov/"
licence = "Public domain (U.S. Government work)"
licence_url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
citation = "PubChem, National Center for Biotechnology Information, U.S. National Library of Medicine: compound records found by name (PUG REST compound/name/{name}/property/MolecularFormula). https://pubchem.ncbi.nlm.nih.gov/"
kind = "fetched"
notes = "Every compound in tools/curated/chemistry.toml that cites this source is looked up by its name (or by the row's `lookup` name); a compound whose PubChem molecular formula has different element counts from ours is left out and reported, and the record's CID is stored with each one that matches."

[shannon1976]
title = "Shannon's effective ionic radii"
url = "https://doi.org/10.1107/S0567739476001551"
