licence_url = "https://doi.org/10.1107/S0567739476001551"
citation = "R. D. Shannon, Revised effective ionic radii and systematic studies of interatomic distances in halides and chalcogenides, Acta Crystallographica A32, 751–767 (1976), doi:10.1107/S0567739476001551."
