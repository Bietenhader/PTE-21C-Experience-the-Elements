licence = "Free for use; cite ENSDF and the IAEA Nuclear Data Section"
licence_url = "https://nds.iaea.org/relnsd/vcharthtml/api_v0_guide.html"
citation = "IAEA Nuclear Data Section, LiveChart of Nuclides, data API https://nds.iaea.org/relnsd/v1/data (ground states of all nuclides), based on ENSDF."
kind = "fetched"
notes = "One CSV request: ?fields=ground_states&nuclides=all. Used in M0 for natural abundances, nuclear spins and half-lives (most-stable mass number, radioactivity, hyperfine applicability)."

